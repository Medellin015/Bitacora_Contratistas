/* ===== 6. Formulario ===== */
const PaginaFormulario = () => {
  const app = useApp();
  const formularioId = app.ruta.params[0];
  const q = app.ruta.query || {};
  const modo = q.modo || 'nuevo';
  const envioId = q.envio ? decodeURIComponent(q.envio) : '';
  const formulario = app.formularios.find((f) => f.id === formularioId);
  const contrato = app.contrato;
  const [previa, setPrevia] = useState(null);
  const [estadoGuardado, setEstadoGuardado] = useState({ fecha: null, guardando: false, error: null });
  const [decisionBorrador, setDecisionBorrador] = useState(null); // null | 'continuar' | 'nuevo'
  const ultimoGuardado = useRef(null);
  const { datos, cargando, error } = useCarga(async () => {
    if (!formulario || !contrato) return null;
    const uid = app.usuario.id;
    const envio = envioId ? await DB.obtenerEnvio(envioId) : null;
    const periodo = envio ? envio.periodo : app.periodo;
    // El admin diligencia en nombre del contratista: los datos del Word salen del perfil del contratista, no del suyo.
    let usuarioFormulario = app.usuario;
    if (app.rol !== 'contratista') {
      const perfil = contrato.contratistaUid ? await DB.obtenerPerfil(contrato.contratistaUid).catch(() => null) : null;
      const ic = (contrato.info && contrato.info.contratista) || {};
      usuarioFormulario = perfil || { id: contrato.contratistaUid, nombreCompleto: ic.nombreCompleto || '', nombreCorto: U.nombreCorto(...String(ic.nombreCompleto || '').split(/\s+(.*)/)), cedula: contrato.cedulaContratista || ic.cedula || '', correo: contrato.correoContratista || '' };
    }
    const idBorrador = DB.idBorrador(uid, contrato.id, formulario.id, periodo);
    const [borrador, contador, lista] = await Promise.all([
      modo === 'nuevo' ? DB.obtenerBorrador(idBorrador).catch(() => null) : Promise.resolve(null),
      DB.obtenerContador(contrato.id, formulario.id).catch(() => null),
      DB.listarEnvios({ rol: app.rol, uid, contratoId: contrato.id, formularioId: formulario.id }),
    ]);
    const enviosPeriodo = lista.filter((e) => e.periodo === periodo);
    // Último envío distinto del que se corrige: fuente de «Traer del mes anterior».
    const ultimo = lista.find((e) => e.id !== envioId) || null;
    let local = null;
    try { local = JSON.parse(localStorage.getItem(`bitacora.borrador.${idBorrador}`) || 'null'); } catch (e) { local = null; }
    return { envio, periodo, idBorrador, borrador: borrador || (local && local.respuestas ? { ...local, actualizadoEn: new Date(local.actualizadoEn || Date.now()), soloLocal: true } : null), contador, enviosPeriodo, ultimo, usuarioFormulario };
  }, [formularioId, contrato && contrato.id, modo, envioId, app.periodo]);

  if (!formulario) return <Vacio icono="formulario" titulo="Formulario no encontrado" accion={<Boton onClick={() => app.navegar('#/inicio')}>Volver al inicio</Boton>} />;
  if (!contrato) return <Vacio icono="contrato" titulo="Elige un contrato" texto="Selecciona el contrato en la barra superior." />;
  if (cargando) return <Cargando texto="Preparando el formulario…" />;
  if (error) return <Alerta tipo="error">{DB.traducirError(error)}</Alerta>;
  const { envio, periodo, idBorrador, borrador, contador, enviosPeriodo, ultimo, usuarioFormulario } = datos;
  const enNombreDeOtro = app.rol !== 'contratista';
  const ahora = new Date();
  const rango = U.recortarPeriodo(periodo, contrato);
  const esCorreccion = modo === 'correccion';
  const esLectura = modo === 'ver';
  const ventanaOk = !requiereVentana(formulario) || U.estadoVentana(app.ventana, formulario.id, ahora).estado === 'abierta';
  const limite = limiteDe(formulario);

  // Bloqueos previos (también se validan en las reglas).
  if (esCorreccion && (!envio || !correccionVigente(envio, ahora))) return <Alerta tipo="alerta">Este envío no está en corrección o el plazo venció. Pide un nuevo plazo desde Solicitudes.</Alerta>;
  if (esLectura && !envio) return <Alerta tipo="error">El envío no existe.</Alerta>;
  if (!esCorreccion && !esLectura) {
    if (!ventanaOk) return <Alerta tipo="alerta"><strong>La ventana de {U.nombrePeriodo(periodo)} no está abierta</strong> para {formulario.nombre}. Fuera de ventana solo se consulta; las correcciones van por Solicitudes.</Alerta>;
    if (limite != null && enviosPeriodo.length >= limite) return <Alerta tipo="info"><strong>Ya enviaste {formulario.nombre} de {U.nombrePeriodo(periodo)}.</strong> Puedes verlo en Mis envíos; si necesitas cambiarlo, crea una solicitud de corrección. <div className="mt-2 flex gap-2"><Boton tam="sm" onClick={() => app.navegar('#/envios')}>Mis envíos</Boton><Boton tam="sm" onClick={() => app.navegar('#/solicitudes')}>Solicitudes</Boton></div></Alerta>;
    if (!rango) return <Alerta tipo="alerta">El período {U.nombrePeriodo(periodo)} está fuera de las fechas del contrato.</Alerta>;
    if (borrador && decisionBorrador === null) {
      return (
        <Modal titulo="Tienes un borrador guardado" descripcion={`Guardado ${U.tiempoRelativo(borrador.actualizadoEn)}${borrador.soloLocal ? ' (solo en este dispositivo)' : ''}`} onCerrar={() => app.navegar('#/inicio')}
          pie={<><Boton icono="basura" onClick={async () => { try { await DB.eliminarBorrador(idBorrador); } catch (e) { /* no existía */ } try { localStorage.removeItem(`bitacora.borrador.${idBorrador}`); } catch (e) { /* nada */ } setDecisionBorrador('nuevo'); }}>Empezar de nuevo</Boton><Boton variante="primario" icono="editar" onClick={() => setDecisionBorrador('continuar')}>Continuar borrador</Boton></>}>
          <p className="text-sm texto-2">Puedes continuar donde ibas o descartar el borrador y empezar con los valores por defecto.</p>
        </Modal>
      );
    }
  }
  const consecutivoSugerido = (contador ? Number(contador.ultimo) || 0 : 0) + 1;
  const ctx = { usuario: usuarioFormulario, contrato, parametros: app.parametros, catalogos: app.catalogos, periodo: rango || U.rangoPeriodo(periodo), consecutivo: consecutivoSugerido };
  const respuestasIniciales = esCorreccion || esLectura ? envio.respuestas : (decisionBorrador === 'continuar' && borrador ? borrador.respuestas : null);
  const puedeEditar = (qx) => {
    if (esLectura) return false;
    if (qx.soloRevisor) return false;
    if (esCorreccion && qx.editableEnCorreccion === false) return false;
    // El consecutivo solo se edita antes del primer envío del contrato (regla: nunca ≤ al último).
    if (qx.porDefecto === 'consecutivo' && contador) return false;
    return true;
  };
  const guardarBorrador = async (respuestas, capituloActual) => {
    if (esLectura) return;
    const doc = { uid: app.usuario.id, contratoId: contrato.id, formularioId: formulario.id, periodo, respuestas, capituloActual: capituloActual || null };
    ultimoGuardado.current = doc;
    setEstadoGuardado((s) => ({ ...s, guardando: true }));
    try { localStorage.setItem(`bitacora.borrador.${idBorrador}`, JSON.stringify({ ...doc, actualizadoEn: new Date().toISOString() })); } catch (e) { /* sin espacio */ }
    try { await DB.guardarBorrador(idBorrador, doc); setEstadoGuardado({ fecha: new Date(), guardando: false, error: null }); }
    catch (e) { setEstadoGuardado({ fecha: null, guardando: false, error: 'no se guardó en el servidor (queda copia local)' }); }
  };
  const subir = async (archivo, pregunta) => {
    if (ultimoGuardado.current) await DB.guardarBorrador(idBorrador, ultimoGuardado.current).catch(() => {});
    return Flujos.subirArchivo({ origen: esCorreccion ? 'envio' : 'borrador', docId: esCorreccion ? envio.id : idBorrador, preguntaId: pregunta.id, archivo, maxMB: pregunta.maxMB || 15 });
  };
  const armarDocumentos = async (respuestas, voBoTexto) => {
    const foto = Descargas.armarFoto(formulario, respuestas, { catalogos: app.catalogos, parametros: app.parametros });
    const datosDescarga = Descargas.armarDatosDescarga({ formulario, respuestas, contrato, usuario: usuarioFormulario, parametros: app.parametros, catalogos: app.catalogos, voBoTexto });
    const anexos = Descargas.recolectarAnexos(formulario, respuestas);
    const totales = Descargas.armarTotales(formulario, respuestas, { parametros: app.parametros });
    return { foto, datosDescarga, anexos, totales };
  };
  const vistaPrevia = async (respuestas) => {
    const docs = await armarDocumentos(respuestas, '');
    let firma = null;
    try { firma = usuarioFormulario.id ? await DB.obtenerFirma(usuarioFormulario.id) : null; } catch (e) { firma = null; }
    const envioTemporal = { ...docs, formularioId: formulario.id, contratoId: contrato.id, periodo, estado: 'borrador', consecutivo: respuestas.numeroInforme || respuestas.numeroCuenta || consecutivoSugerido, respuestas };
    setPrevia({ generar: () => Descargas.generarDocx({ envio: envioTemporal, formulario, contrato, usuario: usuarioFormulario, parametros: app.parametros, firma }) });
  };
  const enviar = async (respuestas) => {
    const texto = esCorreccion ? '¿Reenviar el envío corregido? Volverá al revisor en el mismo paso.' : `¿Enviar ${formulario.nombre} de ${U.nombrePeriodo(periodo)}? ${limite != null ? 'Después de enviar solo podrás cambiarlo con una solicitud de corrección.' : ''}`;
    if (!(await app.confirmar({ titulo: esCorreccion ? 'Reenviar corrección' : 'Enviar formulario', mensaje: texto, textoOk: esCorreccion ? 'Reenviar' : 'Enviar' }))) return;
    try {
      const docs = await armarDocumentos(respuestas, '');
      const fecha = new Date();
      if (esCorreccion) {
        const entrada = { estado: 'reenviado', por: app.usuario.id, porNombre: app.usuario.nombreCompleto, rol: app.rol, fecha, observacion: '' };
        await DB.actualizarEnvio(envio.id, { respuestas, ...docs, estado: 'reenviado', enCorreccion: false, historial: [...(envio.historial || []), entrada] });
        // Las solicitudes aprobadas que incluían este envío pasan a finalizada.
        try {
          const aprobadas = await DB.listarSolicitudes({ rol: app.rol, uid: app.usuario.id, contratoId: contrato.id, estado: 'aprobada' });
          for (const s of aprobadas.filter((x) => (x.envioIds || []).includes(envio.id))) await DB.actualizarSolicitud(s.id, { estado: 'finalizada' });
        } catch (e) { console.warn('No se pudo finalizar la solicitud', e); }
        await Flujos.notificar({ evento: 'envio', coleccion: 'envios', docId: envio.id, por: app.usuario.id });
        try { await DB.eliminarBorrador(idBorrador); } catch (e) { /* nada */ }
        try { localStorage.removeItem(`bitacora.borrador.${idBorrador}`); } catch (e) { /* nada */ }
        app.avisar('exito', 'Corrección reenviada');
        app.recargarContadores();
        app.navegar('#/envios');
        return;
      }
      const flujo = (formulario.config && formulario.config.flujoEstados) || [];
      const consecutivo = Number(respuestas.numeroInforme || respuestas.numeroCuenta) || consecutivoSugerido;
      if (contador && consecutivo <= Number(contador.ultimo)) { app.avisar('error', `El consecutivo debe ser mayor que ${contador.ultimo}`); return; }
      const envioNuevo = {
        contratoId: contrato.id, formularioId: formulario.id, formularioVersion: Number(formulario.version) || 1, periodo, n: enviosPeriodo.length + 1,
        contratistaUid: contrato.contratistaUid, revisores: contrato.revisores || [], coordinadores: contrato.coordinadores || [],
        estado: 'enviado', pasoActual: flujo.length > 1 ? flujo[1] : 'ninguno', enCorreccion: false, fechaLimiteCorreccion: null,
        respuestas, ...docs,
        historial: [{ estado: 'enviado', por: app.usuario.id, porNombre: app.usuario.nombreCompleto, rol: app.rol, fecha, observacion: '' }],
      };
      const { id } = await DB.crearEnvio(envioNuevo, consecutivo);
      try { await DB.eliminarBorrador(idBorrador); } catch (e) { /* nada */ }
      try { localStorage.removeItem(`bitacora.borrador.${idBorrador}`); } catch (e) { /* nada */ }
      await Flujos.notificar({ evento: 'envio', coleccion: 'envios', docId: id, por: app.usuario.id });
      app.avisar('exito', `${formulario.nombre} enviado · No. ${consecutivo}`);
      app.recargarContadores();
      app.navegar('#/envios');
    } catch (e) {
      console.error(e);
      app.avisar('error', e.code === 'permission-denied' ? 'No se pudo enviar: ya existe un envío para este período, la ventana cerró o no tienes permiso.' : DB.traducirError(e));
    }
  };
  const titulo = `${esCorreccion ? 'Corregir' : esLectura ? 'Ver' : 'Diligenciar'} · ${formulario.nombre}`;
  return (
    <div>
      <Encabezado titulo={titulo} subtitulo={`${contrato.numero} · ${U.nombrePeriodo(periodo)}${rango ? ` · ${U.textoPeriodo(rango.desde, rango.hasta)}` : ''}${esCorreccion ? ` · plazo ${U.fechaHora(envio.fechaLimiteCorreccion)}` : ''}`} migas={[{ texto: 'Inicio', onClick: () => app.navegar('#/inicio') }, { texto: formulario.nombre }]} />
      {esCorreccion && envio.historial && envio.historial.length ? <Alerta tipo="alerta" className="mb-4"><strong>Observación del revisor:</strong> {envio.historial.slice(-1)[0].observacion || '—'}</Alerta> : null}
      {enNombreDeOtro ? <Alerta tipo="info" className="mb-4">Estás diligenciando <strong>en nombre de {usuarioFormulario.nombreCompleto || 'el contratista'}</strong>. El envío quedará registrado con tu usuario y rol en el historial (auditoría); el Word sale a nombre del contratista.</Alerta> : null}
      <MotorFormulario key={`${formulario.id}-${decisionBorrador}`} formulario={formulario} ctx={ctx} respuestasIniciales={respuestasIniciales} puedeEditar={puedeEditar} ultimoEnvio={ultimo}
        subir={subir} onGuardar={esLectura ? null : guardarBorrador} estadoGuardado={estadoGuardado} onEnviar={esLectura ? null : enviar} onVistaPrevia={formulario.config && formulario.config.vistaPrevia ? vistaPrevia : null}
        textoEnviar={esCorreccion ? 'Reenviar corrección' : 'Finalizar y enviar'} soloLectura={esLectura} capituloInicial={decisionBorrador === 'continuar' && borrador ? borrador.capituloActual : undefined}
        acciones={<Boton variante="fantasma" onClick={() => app.navegar('#/inicio')}>Salir</Boton>} />
      {previa ? <VistaPreviaDocx titulo={`Vista previa · ${formulario.nombre}`} generar={previa.generar} onCerrar={() => setPrevia(null)} /> : null}
    </div>
  );
};

/* ===== 7. Perfil y firma ===== */
const PaginaPerfil = () => {
  const app = useApp();
  const u = app.usuario;
  const [telefono, setTelefono] = useState(u.telefono || '');
  const [guardando, setGuardando] = useState(false);
  const [claves, setClaves] = useState({ a: '', b: '' });
  const { datos: firma, recargar } = useCarga(() => DB.obtenerFirma(u.id).catch(() => null), [u.id]);
  const guardarTelefono = async () => {
    setGuardando(true);
    try { await DB.actualizarPerfil(u.id, { telefono: telefono.trim() }); app.avisar('exito', 'Teléfono guardado'); app.recargarTodo(); }
    catch (e) { app.avisar('error', DB.traducirError(e)); } finally { setGuardando(false); }
  };
  // La firma se reduce en canvas hasta caber en 150 KB (límite del documento privado).
  const cargarFirma = async (archivo) => {
    if (!archivo) return;
    if (!/image\/(png|jpeg|jpg|webp)/.test(archivo.type)) { app.avisar('alerta', 'Usa una imagen PNG (fondo transparente) o JPG'); return; }
    try {
      const dataUrl = await U.leerArchivoDataURL(archivo);
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
      let ancho = Math.min(img.width, 900), alto = Math.round(img.height * (ancho / img.width));
      let base64 = '';
      for (let intento = 0; intento < 6; intento++) {
        const c = document.createElement('canvas'); c.width = ancho; c.height = alto;
        c.getContext('2d').drawImage(img, 0, 0, ancho, alto);
        base64 = c.toDataURL('image/png').split(',')[1];
        if (base64.length * 0.75 <= 150 * 1024) break;
        ancho = Math.round(ancho * 0.8); alto = Math.round(alto * 0.8);
      }
      if (base64.length * 0.75 > 150 * 1024) { app.avisar('error', 'La firma sigue pesando más de 150 KB; recórtala o usa menos resolución'); return; }
      await DB.guardarFirma(u.id, { pngBase64: base64, ancho, alto });
      app.avisar('exito', 'Firma guardada');
      recargar();
    } catch (e) { app.avisar('error', DB.traducirError(e)); }
  };
  const quitarFirma = async () => {
    if (!(await app.confirmar({ titulo: 'Quitar firma', mensaje: 'El Word saldrá sin firma hasta que subas otra.', textoOk: 'Quitar', peligro: true }))) return;
    try { await DB.guardarFirma(u.id, { pngBase64: '', ancho: 0, alto: 0 }); recargar(); } catch (e) { app.avisar('error', DB.traducirError(e)); }
  };
  const cambiarClave = async () => {
    if (claves.a.length < 6) { app.avisar('alerta', 'Mínimo 6 caracteres'); return; }
    if (claves.a !== claves.b) { app.avisar('alerta', 'Las contraseñas no coinciden'); return; }
    try { await Auth.cambiarClave(claves.a); app.avisar('exito', 'Contraseña actualizada'); setClaves({ a: '', b: '' }); } catch (e) { app.avisar('error', Auth.traducirError(e)); }
  };
  return (
    <div>
      <Encabezado titulo="Mi perfil" subtitulo="Datos de la cuenta, firma para el Word y preferencias." />
      <div className="grid gap-4 lg:grid-cols-2 items-start">
        <div className="tarjeta"><div className="tarjeta-cabecera"><h2>Datos</h2><Chip tipo="primario">{U.ROLES[app.rol]}</Chip></div><div className="tarjeta-cuerpo grid gap-4">
          <ListaDatos items={[{ etiqueta: 'Nombre', valor: u.nombreCompleto }, { etiqueta: 'Cédula', valor: u.cedula, mono: true }, { etiqueta: 'Correo', valor: u.correo }, app.rol === 'contratista' && app.contrato ? { etiqueta: 'Correos de revisores', valor: (app.contrato.correosRevisores || []).join(', ') } : null]} />
          <Campo etiqueta="Teléfono" id="perfil-tel"><div className="flex gap-2"><Entrada id="perfil-tel" inputMode="tel" value={telefono} onChange={(e) => setTelefono(e.target.value)} /><Boton variante="primario" cargando={guardando} onClick={guardarTelefono}>Guardar</Boton></div></Campo>
          <Campo etiqueta="Tema"><Segmentado etiqueta="Tema" valor={app.tema} opciones={[{ valor: 'claro', etiqueta: 'Claro' }, { valor: 'oscuro', etiqueta: 'Oscuro' }]} onCambio={(v) => { if (v !== app.tema) app.alternarTema(); }} /></Campo>
        </div></div>
        <div className="grid gap-4">
          <div className="tarjeta"><div className="tarjeta-cabecera"><h2>Firma para el Word</h2></div><div className="tarjeta-cuerpo grid gap-3">
            <p className="text-sm texto-2">Imagen PNG con fondo transparente (máx. 150 KB). Se escala al recuadro del formato (2,35″ × 0,41″) conservando la proporción.</p>
            {firma && firma.pngBase64 ? <div className="flex items-center gap-3 flex-wrap"><img className="firma-vista" alt="Firma actual" src={`data:image/png;base64,${firma.pngBase64}`} /><Boton tam="sm" variante="fantasma" icono="basura" onClick={quitarFirma}>Quitar</Boton></div> : <span className="texto-3 text-sm">Sin firma: el Word saldrá con el espacio en blanco.</span>}
            <label className="zona-soltar block cursor-pointer"><input type="file" className="sr-solo" accept="image/png,image/jpeg,image/webp" onChange={(e) => { cargarFirma(e.target.files[0]); e.target.value = ''; }} /><div className="flex items-center justify-center gap-2 text-sm"><Icono nombre="firma" /> Subir imagen de la firma</div></label>
          </div></div>
          {!MODO_DEMO ? <div className="tarjeta"><div className="tarjeta-cabecera"><h2>Contraseña</h2></div><div className="tarjeta-cuerpo grid gap-3">
            <div className="grid sm:grid-cols-2 gap-3"><Campo etiqueta="Nueva contraseña" id="clave-a"><Entrada id="clave-a" type="password" autoComplete="new-password" value={claves.a} onChange={(e) => setClaves({ ...claves, a: e.target.value })} /></Campo><Campo etiqueta="Repetir" id="clave-b"><Entrada id="clave-b" type="password" autoComplete="new-password" value={claves.b} onChange={(e) => setClaves({ ...claves, b: e.target.value })} /></Campo></div>
            <Boton icono="candado" onClick={cambiarClave} className="justify-self-start">Cambiar contraseña</Boton>
          </div></div> : null}
        </div>
      </div>
    </div>
  );
};
</script>
<script type="text/babel" data-presets="react" data-modulo="85-revision">
/* ============================================================================
   13) revision.jsx — revisor y coordinador: bandeja de revisión, solicitudes,
       contratos asignados y reportes (los reportes también los usa el admin)
   Estructura:
     1. Reglas del flujo de estados (paso propio, paso final, transiciones)
     2. Bandeja (lista + detalle) con Aprobar / Devolver / Reabrir / Tomar en revisión
     3. Solicitudes (aprobar con fecha límite, rechazar con motivo)
     4. Contratos asignados
     5. Reportes y Excel (envíos, cumplimiento, solicitudes, recordatorios)
   ============================================================================ */

/* ===== 1. Flujo de estados ===== */
const flujoDe = (formulario) => (formulario && formulario.config && Array.isArray(formulario.config.flujoEstados) ? formulario.config.flujoEstados : []);
const pasoFinalDe = (formulario) => { const f = flujoDe(formulario); return f.length ? f[f.length - 1] : 'ninguno'; };
const primerPasoDe = (formulario) => { const f = flujoDe(formulario); return f.length > 1 ? f[1] : 'ninguno'; };
// ¿El usuario tiene el paso actual del envío? (admin siempre)
const tieneElPaso = (envio, rol, uid) => {
  if (rol === 'admin') return envio.estado !== 'aprobado';
  if (envio.pasoActual !== rol) return false;
  return rol === 'revisor' ? (envio.revisores || []).includes(uid) : (envio.coordinadores || []).includes(uid);
};
const pendienteDeMi = (envio, rol, uid) => tieneElPaso(envio, rol, uid) && !envio.enCorreccion && envio.estado !== 'aprobado';
const nombreContratistaDe = (envio, contratos) => {
  const c = (contratos || []).find((x) => x.id === envio.contratoId);
  const h = (envio.historial || [])[0];
  return (c && c.info && c.info.contratista && c.info.contratista.nombreCompleto) || (h && h.porNombre) || envio.contratistaUid;
};

/* ===== 2. Bandeja ===== */
const ModalDevolver = ({ titulo, onCerrar, onConfirmar, textoOk = 'Devolver' }) => {
  const [observacion, setObservacion] = useState('');
  const [fecha, setFecha] = useState(U.sumarDias(U.hoyISO(), 3));
  const [cargando, setCargando] = useState(false);
  const confirmar = async () => {
    if (observacion.trim().length < 5) return;
    if (!U.esISO(fecha) || fecha < U.hoyISO()) return;
    setCargando(true);
    try { await onConfirmar({ observacion: observacion.trim(), fechaLimite: U.finDeDiaBogota(fecha) }); } finally { setCargando(false); }
  };
  return (
    <Modal titulo={titulo} onCerrar={onCerrar} pie={<><Boton onClick={onCerrar}>Cancelar</Boton><Boton variante="acento" icono="editar" cargando={cargando} disabled={observacion.trim().length < 5 || !U.esISO(fecha) || fecha < U.hoyISO()} onClick={confirmar}>{textoOk}</Boton></>}>
      <div className="grid gap-4">
        <Campo etiqueta="Observación para el contratista" obligatoria ayuda="Qué debe corregir. Se envía por correo."><Area autoFocus value={observacion} onChange={(e) => setObservacion(e.target.value)} rows={4} /></Campo>
        <Campo etiqueta="Fecha límite" obligatoria ayuda="El plazo vence ese día a las 23:59 (hora de Bogotá)."><Entrada type="date" className="mono" min={U.hoyISO()} value={fecha} onChange={(e) => setFecha(e.target.value)} /></Campo>
      </div>
    </Modal>
  );
};
const DetalleRevision = ({ envio, onCambio }) => {
  const app = useApp();
  const formulario = app.formularios.find((f) => f.id === envio.formularioId);
  const contrato = app.contratos.find((c) => c.id === envio.contratoId);
  const [modal, setModal] = useState(null); // 'devolver' | 'reabrir' | 'diferencias'
  const [diferencias, setDiferencias] = useState(null);
  const [ocupado, setOcupado] = useState(false);
  const [pestana, setPestana] = useState('respuestas');
  const esPaso = tieneElPaso(envio, app.rol, app.usuario.id);
  const esFinal = envio.pasoActual === pasoFinalDe(formulario) || app.rol === 'admin';
  const ahora = new Date();

  // El revisor regenera datosDescarga desde respuestas + contrato; si difiere, solo puede devolver.
  const verificarDescarga = async () => {
    if (!formulario || !['informe_itm_sif', 'cuenta_cobro_provisional'].includes(formulario.plantillaDescarga)) return {};
    const contratoVivo = contrato || await DB.obtenerContrato(envio.contratoId);
    const usuario = (await DB.obtenerPerfil(envio.contratistaUid)) || { nombreCompleto: nombreContratistaDe(envio, app.contratos), cedula: '' };
    const regenerado = Descargas.armarDatosDescarga({ formulario, respuestas: envio.respuestas, contrato: contratoVivo, usuario, parametros: app.parametros, catalogos: app.catalogos, voBoTexto: (envio.datosDescarga && envio.datosDescarga.voBoTexto) || '' });
    // Se comparan solo los campos que salen de las respuestas y del contrato; los que vienen de
    // parametros/app (ciudad, NIT, texto de la declaración) pueden cambiar después sin invalidar el envío.
    const ignorar = new Set(['voBoTexto', 'ciudad', 'entidad', 'nit', 'textoDeclaracion', 'formato']);
    const dif = U.diferencias(envio.datosDescarga || {}, regenerado);
    Object.keys(dif).forEach((k) => { if (ignorar.has(k.split('.')[0])) delete dif[k]; });
    return dif;
  };
  const transicion = async (parcial, entrada, evento) => {
    setOcupado(true);
    try {
      await DB.actualizarEnvio(envio.id, { ...parcial, historial: [...(envio.historial || []), { por: app.usuario.id, porNombre: app.usuario.nombreCompleto, rol: app.rol, fecha: new Date(), observacion: '', ...entrada, estado: parcial.estado }] });
      if (evento) await Flujos.notificar({ evento, coleccion: 'envios', docId: envio.id, por: app.usuario.id });
      app.avisar('exito', `Envío ${U.ESTADOS[parcial.estado].etiqueta.toLowerCase()}`);
      onCambio();
    } catch (e) { app.avisar('error', DB.traducirError(e)); } finally { setOcupado(false); }
  };
  const tomar = () => transicion({ estado: 'en_revision' }, {}, null);
  const aprobar = async () => {
    setOcupado(true);
    try {
      const dif = await verificarDescarga();
      if (Object.keys(dif).length) { setDiferencias(dif); setModal('diferencias'); setOcupado(false); return; }
    } catch (e) { app.avisar('error', `No se pudo verificar la descarga: ${e.message}`); setOcupado(false); return; }
    const final = esFinal;
    const texto = final ? `¿Aprobar definitivamente ${formulario.nombre} de ${U.nombrePeriodo(envio.periodo)}? Quedará de solo lectura.` : '¿Aprobar y pasar al coordinador?';
    if (!(await app.confirmar({ titulo: 'Aprobar envío', mensaje: texto, textoOk: 'Aprobar' }))) { setOcupado(false); return; }
    const parcial = final ? { estado: 'aprobado', pasoActual: 'ninguno' } : { estado: 'aprobado_revisor', pasoActual: 'coordinador' };
    if (final && app.parametros.voBoDigitalEnWord) parcial['datosDescarga.voBoTexto'] = `Aprobado en la plataforma por ${app.usuario.nombreCompleto} el ${U.fechaCorta(new Date())}`;
    await transicion(parcial, {}, final ? 'aprobacion' : null);
  };
  const devolver = async ({ observacion, fechaLimite }) => {
    setOcupado(true);
    try {
      const reabrir = envio.estado === 'aprobado';
      const parcial = reabrir ? { estado: 'en_correccion', enCorreccion: true, fechaLimiteCorreccion: fechaLimite, pasoActual: primerPasoDe(formulario) } : { estado: 'en_correccion', enCorreccion: true, fechaLimiteCorreccion: fechaLimite };
      await DB.actualizarEnvio(envio.id, { ...parcial, historial: [...(envio.historial || []), { estado: 'en_correccion', por: app.usuario.id, porNombre: app.usuario.nombreCompleto, rol: app.rol, fecha: new Date(), observacion }] });
      // La devolución directa queda registrada como solicitud ya aprobada con origen «revisor».
      try {
        await DB.crearSolicitud({ contratoId: envio.contratoId, contratistaUid: envio.contratistaUid, revisores: envio.revisores || [], coordinadores: envio.coordinadores || [], tipo: 'correccion', origen: 'revisor', envioIds: [envio.id], formularios: [envio.formularioId], observacion, fechaLimite, estado: 'aprobada', revisorUid: app.usuario.id, motivoRechazo: null });
      } catch (e) { console.warn('No se pudo registrar la solicitud de devolución', e); }
      await Flujos.notificar({ evento: 'devolucion', coleccion: 'envios', docId: envio.id, por: app.usuario.id });

  };
  const foto = envio.foto || [];
  return (
    <div className="tarjeta">
      <div className="tarjeta-cabecera flex-wrap">
        <div className="min-w-0">
          <h2>{formulario ? formulario.nombre : envio.formularioId} · {U.nombrePeriodo(envio.periodo)}</h2>
          <div className="text-sm texto-2">{nombreContratistaDe(envio, app.contratos)} · {contrato ? contrato.numero : envio.contratoId} · <span className="mono">No. {envio.consecutivo}</span></div>
        </div>
        <div className="flex items-center gap-2 flex-wrap"><ChipEstado estado={envio.estado} />{envio.enCorreccion ? <Chip tipo="alerta" icono="reloj">plazo {U.fechaHora(envio.fechaLimiteCorreccion)}</Chip> : null}{envio.pasoActual !== 'ninguno' ? <Chip tipo="neutro">Paso: {U.ROLES[envio.pasoActual] || envio.pasoActual}</Chip> : null}</div>
      </div>
      <div className="tarjeta-cuerpo">
        <div className="flex gap-2 flex-wrap mb-4">
          <AccionesEnvio envio={envio} />
          {esPaso && !envio.enCorreccion && ['enviado', 'reenviado'].includes(envio.estado) ? <Boton tam="sm" icono="ojo" cargando={ocupado} onClick={tomar}>Tomar en revisión</Boton> : null}
          {esPaso && !envio.enCorreccion && envio.estado !== 'aprobado' ? <Boton tam="sm" variante="primario" icono="check" cargando={ocupado} onClick={aprobar}>{esFinal ? 'Aprobar' : 'Aprobar y pasar al coordinador'}</Boton> : null}
          {esPaso && !envio.enCorreccion && envio.estado !== 'aprobado' ? <Boton tam="sm" variante="acento" icono="editar" disabled={ocupado} onClick={() => setModal('devolver')}>Devolver</Boton> : null}
          {envio.estado === 'aprobado' && ((app.rol === 'revisor' && (envio.revisores || []).includes(app.usuario.id)) || (app.rol === 'coordinador' && (envio.coordinadores || []).includes(app.usuario.id)) || app.rol === 'admin') ? <Boton tam="sm" icono="refrescar" disabled={ocupado} onClick={() => setModal('reabrir')}>Reabrir para corrección</Boton> : null}
          {envio.enCorreccion ? <span className="text-sm texto-2 self-center">{correccionVigente(envio, ahora) ? 'En manos del contratista hasta la fecha límite.' : 'El plazo de corrección venció sin reenvío.'}</span> : null}
        </div>
        <Pestanas activa={pestana} onCambio={setPestana} lista={[{ id: 'respuestas', etiqueta: 'Respuestas', icono: 'formulario' }, { id: 'historial', etiqueta: 'Historial', icono: 'reloj', contador: (envio.historial || []).length }, { id: 'anexos', etiqueta: 'Archivos', icono: 'archivo', contador: (envio.anexos || []).length }]} />
        <div className="mt-4">
          {pestana === 'respuestas' ? (
            <div className="grid gap-3">
              {envio.totales && Object.keys(envio.totales).length ? <div className="grid gap-2 grid-cols-2 md:grid-cols-4">{Object.keys(envio.totales).map((k) => <Indicador key={k} titulo={{ valorCobrado: 'Valor cobrado', ibc: 'IBC', salud: 'Salud', pension: 'Pensión', arl: 'ARL', totalObligatorio: 'Obligatorio', totalRealizado: 'Pagado', saldo: 'Saldo', actividades: 'Actividades', promedioEjecucion: 'Ejecución prom.', anexos: 'Anexos' }[k] || k} valor={['actividades', 'anexos'].includes(k) ? envio.totales[k] : k === 'promedioEjecucion' ? `${envio.totales[k]} %` : U.formatoCOP(envio.totales[k])} tipo={k === 'saldo' && envio.totales[k] < -(app.parametros.toleranciaSaldo || 0) ? 'error' : undefined} />)}</div> : null}
              {foto.map((cap) => <FotoCapitulo key={cap.id} cap={cap} />)}
            </div>
          ) : null}
          {pestana === 'historial' ? <LineaTiempo entradas={envio.historial || []} /> : null}
          {pestana === 'anexos' ? ((envio.anexos || []).length ? <ul className="grid gap-1 text-sm">{envio.anexos.map((a, i) => <li key={i} className="flex items-center gap-2"><Icono nombre="archivo" className="texto-3" />{a.url ? <a href={a.url} target="_blank" rel="noopener noreferrer">{a.nombre}</a> : a.nombre}<span className="mono text-xs texto-3">{U.tamanoLegible(a.tamano)}</span></li>)}</ul> : <Vacio icono="archivo" titulo="Sin archivos adjuntos" />) : null}
        </div>
      </div>
      {modal === 'devolver' ? <ModalDevolver titulo="Devolver para corrección" onCerrar={() => setModal(null)} onConfirmar={devolver} /> : null}
      {modal === 'reabrir' ? <ModalDevolver titulo="Reabrir envío aprobado" textoOk="Reabrir" onCerrar={() => setModal(null)} onConfirmar={devolver} /> : null}
      {modal === 'diferencias' ? (
        <Modal titulo="La descarga no coincide con las respuestas" ancho="ancho" onCerrar={() => setModal(null)} pie={<><Boton onClick={() => setModal(null)}>Cerrar</Boton><Boton variante="acento" icono="editar" onClick={() => setModal('devolver')}>Devolver para corrección</Boton></>}>
          <Alerta tipo="alerta" className="mb-3">El Word guardado por el contratista difiere de lo que se genera hoy con sus respuestas y la información del contrato. Por seguridad solo puedes devolverlo; al reenviar se regenera.</Alerta>
          <div className="tabla-envoltura"><table className="tabla diff-tabla"><thead><tr><th>Campo</th><th>Guardado</th><th>Regenerado</th></tr></thead><tbody>{Object.keys(diferencias || {}).map((k) => <tr key={k}><td>{k}</td><td className="diff-antes">{U.limitar(U.valorLegible(diferencias[k].antes), 120)}</td><td className="diff-despues">{U.limitar(U.valorLegible(diferencias[k].despues), 120)}</td></tr>)}</tbody></table></div>
        </Modal>
      ) : null}
    </div>
  );
};
const PaginaRevision = () => {

const SolicitudesRevision = () => {
  const app = useApp();
  const [filtro, setFiltro] = useState('pendiente');
  const [modal, setModal] = useState(null); // { tipo: 'aprobar'|'rechazar', solicitud }

  const lista = (datos || []).filter((s) => filtro === 'todas' || s.estado === filtro);
  const contratoDe = (s) => app.contratos.find((c) => c.id === s.contratoId);
  const aprobar = async (s, { fechaLimite, observacion }) => {
    try {
      if (s.tipo === 'correccion') {
        for (const envioId of (s.envioIds || [])) {
          const envio = await DB.obtenerEnvio(envioId);
          if (!envio) continue;
          const formulario = app.formularios.find((f) => f.id === envio.formularioId);
          const parcial = envio.estado === 'aprobado' ? { estado: 'en_correccion', enCorreccion: true, fechaLimiteCorreccion: fechaLimite, pasoActual: primerPasoDe(formulario) } : { estado: 'en_correccion', enCorreccion: true, fechaLimiteCorreccion: fechaLimite };
          await DB.actualizarEnvio(envioId, { ...parcial, historial: [...(envio.historial || []), { estado: 'en_correccion', por: app.usuario.id, porNombre: app.usuario.nombreCompleto, rol: app.rol, fecha: new Date(), observacion: observacion || `Solicitud aprobada: ${s.observacion}` }] });
          await Flujos.notificar({ evento: 'devolucion', coleccion: 'envios', docId: envioId, por: app.usuario.id });
        }
      } else {
        await DB.actualizarContrato(s.contratoId, { permitirActualizar: true });
      }
      await DB.actualizarSolicitud(s.id, { estado: 'aprobada', revisorUid: app.usuario.id, fechaLimite });
      await Flujos.notificar({ evento: 'solicitud', coleccion: 'solicitudes', docId: s.id, por: app.usuario.id });
      app.avisar('exito', 'Solicitud aprobada');
      setModal(null); recargar(true); app.recargarContadores();
    } catch (e) { app.avisar('error', DB.traducirError(e)); }
  };
  const rechazar = async (s, motivo) => {
    try {
      await DB.actualizarSolicitud(s.id, { estado: 'rechazada', revisorUid: app.usuario.id, motivoRechazo: motivo });
      await Flujos.notificar({ evento: 'solicitud', coleccion: 'solicitudes', docId: s.id, por: app.usuario.id });
      app.avisar('exito', 'Solicitud rechazada');
      setModal(null); recargar(true); app.recargarContadores();
    } catch (e) { app.avisar('error', DB.traducirError(e)); }
  };
  return (
    <div>
      <Encabezado titulo="Solicitudes" subtitulo="Correcciones y actualizaciones pedidas por los contratistas de tus contratos." acciones={<Boton tam="sm" variante="fantasma" icono="refrescar" onClick={() => recargar()}>Actualizar</Boton>} />
      <div className="mb-4"><Segmentado etiqueta="Estado" valor={filtro} onCambio={setFiltro} opciones={[{ valor: 'pendiente', etiqueta: 'Pendientes' }, { valor: 'aprobada', etiqueta: 'Aprobadas' }, { valor: 'rechazada', etiqueta: 'Rechazadas' }, { valor: 'finalizada', etiqueta: 'Finalizadas' }, { valor: 'todas', etiqueta: 'Todas' }]} /></div>
      <Tabla cargando={cargando} filas={lista} vacio={<Vacio icono="solicitudes" titulo="Sin solicitudes" />}
        columnas={[
          { titulo: 'Fecha', render: (s) => <span className="mono text-xs">{U.fechaHora(s.creadoEn)}</span> },
          { titulo: 'Contratista', render: (s) => { const c = contratoDe(s); return c && c.info && c.info.contratista ? c.info.contratista.nombreCompleto : s.contratistaUid; } },
          { titulo: 'Contrato', render: (s) => { const c = contratoDe(s); return c ? c.numero : s.contratoId; } },
          { titulo: 'Tipo', render: (s) => `${U.TIPOS_SOLICITUD[s.tipo] || s.tipo}${s.origen === 'revisor' ? ' (devolución)' : ''}` },
          { titulo: 'Formularios', render: (s) => (s.formularios || []).map((f) => nombreFormulario(app, f)).join(', ') },
          { titulo: 'Observación', render: (s) => <span className="text-sm whitespace-pre-wrap">{s.observacion}</span> },
          { titulo: 'Estado', render: (s) => <span className="flex flex-col gap-1"><ChipSolicitud estado={s.estado} />{s.fechaLimite ? <span className="text-xs mono">{U.fechaHora(s.fechaLimite)}</span> : null}{s.motivoRechazo ? <span className="text-xs texto-2">{s.motivoRechazo}</span> : null}</span> },
        ]}
        acciones={(s) => (s.estado === 'pendiente' ? <><Boton tam="xs" variante="primario" icono="check" onClick={() => setModal({ tipo: 'aprobar', solicitud: s })}>Aprobar</Boton><Boton tam="xs" variante="fantasma" icono="x" onClick={() => setModal({ tipo: 'rechazar', solicitud: s })}>Rechazar</Boton></> : null)} />
      {modal && modal.tipo === 'aprobar' ? (modal.solicitud.tipo === 'correccion'

        : <ModalConfirmarTexto titulo="Aprobar actualización" texto="Se habilitará la edición de «Datos del contratista» para este contrato. Cuando termine, vuelve a cerrarla desde la página del contrato." textoOk="Aprobar" onCerrar={() => setModal(null)} onConfirmar={() => aprobar(modal.solicitud, { fechaLimite: null })} />) : null}
      {modal && modal.tipo === 'rechazar' ? <ModalMotivo titulo="Rechazar solicitud" etiqueta="Motivo del rechazo" textoOk="Rechazar" onCerrar={() => setModal(null)} onConfirmar={(m) => rechazar(modal.solicitud, m)} /> : null}
    </div>
  );
};
const ModalMotivo = ({ titulo, etiqueta, textoOk, onCerrar, onConfirmar }) => {
  const [texto, setTexto] = useState('');
  const [cargando, setCargando] = useState(false);
  return (
    <Modal titulo={titulo} onCerrar={onCerrar} pie={<><Boton onClick={onCerrar}>Cancelar</Boton><Boton variante="peligro" cargando={cargando} disabled={texto.trim().length < 5} onClick={async () => { setCargando(true); try { await onConfirmar(texto.trim()); } finally { setCargando(false); } }}>{textoOk}</Boton></>}>
      <Campo etiqueta={etiqueta} obligatoria><Area autoFocus value={texto} onChange={(e) => setTexto(e.target.value)} rows={4} /></Campo>
    </Modal>
  );
};
const ModalConfirmarTexto = ({ titulo, texto, textoOk, onCerrar, onConfirmar }) => {
  const [cargando, setCargando] = useState(false);
  return <Modal titulo={titulo} onCerrar={onCerrar} pie={<><Boton onClick={onCerrar}>Cancelar</Boton><Boton variante="primario" cargando={cargando} onClick={async () => { setCargando(true); try { await onConfirmar(); } finally { setCargando(false); } }}>{textoOk}</Boton></>}><p className="text-sm">{texto}</p></Modal>;
};

/* ===== 4. Contratos asignados ===== */
const PaginaContratos = () => {
  const app = useApp();
  const [texto, setTexto] = useState('');
  const lista = app.contratos.filter((c) => !texto || U.sinTildes(`${c.numero} ${c.etiqueta || ''} ${(c.info && c.info.contratista && c.info.contratista.nombreCompleto) || ''}`).toLowerCase().includes(U.sinTildes(texto).toLowerCase()));
  return (
    <div>
      <Encabezado titulo="Contratos asignados" subtitulo={`${app.contratos.length} ${U.plural(app.contratos.length, 'contrato', 'contratos')} donde eres ${app.rol === 'coordinador' ? 'coordinador' : 'revisor'}`} />
      <div className="relative mb-4 max-w-md"><Entrada placeholder="Buscar por número, etiqueta o contratista" value={texto} onChange={(e) => setTexto(e.target.value)} className="campo-con-icono" aria-label="Buscar contrato" /><Icono nombre="buscar" className="absolute left-3 top-1/2 -translate-y-1/2 texto-3" /></div>
      <Tabla filas={lista} vacio={<Vacio icono="contrato" titulo="Sin contratos asignados" texto="El administrador te asigna contratos desde Contratistas y contratos." />}
        columnas={[
          { titulo: 'Contrato', render: (c) => <span className="mono">{c.numero}</span> },
          { titulo: 'Etiqueta', clave: 'etiqueta' },
          { titulo: 'Contratista', render: (c) => (c.info && c.info.contratista && c.info.contratista.nombreCompleto) || '—' },
          { titulo: 'Cuenta', render: (c) => (c.contratistaUid ? <Chip tipo="exito" icono="check">Activada</Chip> : <Chip tipo="alerta" icono="reloj">Sin activar</Chip>) },
          { titulo: 'Estado', render: (c) => <Chip tipo={c.estado === 'terminado' ? 'neutro' : 'primario'}>{c.estado === 'terminado' ? 'Terminado' : 'Activo'}</Chip> },
          { titulo: 'Edición del contratista', render: (c) => (c.permitirActualizar ? 'Habilitada' : 'Cerrada') },
        ]} acciones={(c) => <Boton tam="xs" icono="derecha" onClick={() => { app.elegirContrato(c.id); app.navegar('#/contrato'); }}>Abrir</Boton>} />
    </div>
  );
};

/* ===== 5. Reportes ===== */
const PaginaReportes = () => {
  const app = useApp();
  const [periodo, setPeriodo] = useState(app.periodo);
  const [formularioId, setFormularioId] = useState('');
  const [pestana, setPestana] = useState('envios');
  const [recordando, setRecordando] = useState(false);
  const { datos, cargando, recargar } = useCarga(async () => {
    const [envios, solicitudes, ventana] = await Promise.all([DB.listarEnvios({ rol: app.rol, uid: app.usuario.id, periodo }), DB.listarSolicitudes({ rol: app.rol, uid: app.usuario.id }), DB.obtenerVentana(periodo).catch(() => null)]);
    return { envios, solicitudes, ventana };
  }, [periodo, app.usuario.id, app.rol]);
  const envios = ((datos && datos.envios) || []).filter((e) => !formularioId || e.formularioId === formularioId);
  const solicitudes = (datos && datos.solicitudes) || [];
  const formulariosPeriodo = app.formularios.filter((f) => f.activo && f.tipo !== 'INFO_CONTRATO' && (!formularioId || f.id === formularioId) && (!(datos && datos.ventana) || (datos.ventana.formularios || []).includes(f.id) || !requiereVentana(f)));
  const cumplimiento = useMemo(() => {
    const filas = [];
    app.contratos.filter((c) => c.estado !== 'terminado' && U.recortarPeriodo(periodo, c)).forEach((c) => formulariosPeriodo.forEach((f) => {
      const env = ((datos && datos.envios) || []).filter((e) => e.contratoId === c.id && e.formularioId === f.id);
      filas.push({ id: `${c.id}-${f.id}`, contratoId: c.id, contrato: c.numero, contratista: (c.info && c.info.contratista && c.info.contratista.nombreCompleto) || '—', correo: c.correoContratista || '', formulario: f.nombre, estado: env[0] ? (U.ESTADOS[env[0].estado] || {}).etiqueta || env[0].estado : 'Sin enviar', enviado: env[0] ? env[0].enviadoEn : null, pendiente: !env[0] });
    }));
    return filas;
  }, [app.contratos, formulariosPeriodo, datos, periodo]);
  const filasEnvios = envios.map((e) => { const c = app.contratos.find((x) => x.id === e.contratoId); const t = e.totales || {}; return {
    id: e.id, contratista: nombreContratistaDe(e, app.contratos), contrato: c ? c.numero : e.contratoId, formulario: nombreFormulario(app, e.formularioId), periodo: e.periodo, estado: (U.ESTADOS[e.estado] || {}).etiqueta || e.estado,
    enviadoEn: e.enviadoEn, consecutivo: e.consecutivo, valorCobrado: t.valorCobrado, ibc: t.ibc, salud: t.salud, pension: t.pension, arl: t.arl, totalObligatorio: t.totalObligatorio, totalRealizado: t.totalRealizado, saldo: t.saldo, promedioEjecucion: t.promedioEjecucion, ultimaFecha: (e.historial || []).slice(-1)[0] ? e.historial.slice(-1)[0].fecha : null,
  }; });
  const filasSolicitudes = solicitudes.map((s) => { const c = app.contratos.find((x) => x.id === s.contratoId); return { id: s.id, fecha: s.creadoEn, contratista: c && c.info && c.info.contratista ? c.info.contratista.nombreCompleto : s.contratistaUid, contrato: c ? c.numero : s.contratoId, tipo: U.TIPOS_SOLICITUD[s.tipo] || s.tipo, origen: s.origen, formularios: (s.formularios || []).map((f) => nombreFormulario(app, f)), observacion: s.observacion, estado: (U.ESTADOS_SOLICITUD[s.estado] || {}).etiqueta || s.estado, fechaLimite: s.fechaLimite, motivoRechazo: s.motivoRechazo || '' }; });
  const exportar = () => {
    try {
      const r = Descargas.exportarExcel({ nombreArchivo: `Reporte ${U.nombrePeriodo(periodo)} - ${app.parametros.siglaArchivo || 'ITMSIF'}.xlsx`, hojas: [
        { nombre: 'Envíos', filas: filasEnvios, columnas: [
          { titulo: 'Contratista', clave: 'contratista', ancho: 30 }, { titulo: 'Contrato', clave: 'contrato', ancho: 18 }, { titulo: 'Formulario', clave: 'formulario', ancho: 30 }, { titulo: 'Período', clave: 'periodo', ancho: 10 },
          { titulo: 'Estado', clave: 'estado', ancho: 18 }, { titulo: 'Enviado', clave: 'enviadoEn', formato: 'fecha', ancho: 18 }, { titulo: 'Última novedad', clave: 'ultimaFecha', formato: 'fecha', ancho: 18 }, { titulo: 'Consecutivo', clave: 'consecutivo', formato: 'numero', ancho: 12 },
          { titulo: 'Valor cobrado', clave: 'valorCobrado', formato: 'cop', ancho: 16 }, { titulo: 'IBC', clave: 'ibc', formato: 'cop', ancho: 16 }, { titulo: 'Salud', clave: 'salud', formato: 'cop', ancho: 14 }, { titulo: 'Pensión', clave: 'pension', formato: 'cop', ancho: 14 }, { titulo: 'ARL', clave: 'arl', formato: 'cop', ancho: 14 },
          { titulo: 'Total obligatorio', clave: 'totalObligatorio', formato: 'cop', ancho: 16 }, { titulo: 'Total pagado', clave: 'totalRealizado', formato: 'cop', ancho: 16 }, { titulo: 'Saldo', clave: 'saldo', formato: 'cop', ancho: 14 }, { titulo: 'Ejecución promedio', clave: 'promedioEjecucion', formato: 'porcentaje', ancho: 14 },
        ] },
        { nombre: 'Cumplimiento', filas: cumplimiento, columnas: [{ titulo: 'Contratista', clave: 'contratista', ancho: 30 }, { titulo: 'Correo', clave: 'correo', ancho: 28 }, { titulo: 'Contrato', clave: 'contrato', ancho: 18 }, { titulo: 'Formulario', clave: 'formulario', ancho: 30 }, { titulo: 'Estado', clave: 'estado', ancho: 18 }, { titulo: 'Enviado', clave: 'enviado', formato: 'fecha', ancho: 18 }] },
        { nombre: 'Solicitudes', filas: filasSolicitudes, columnas: [{ titulo: 'Fecha', clave: 'fecha', formato: 'fecha', ancho: 18 }, { titulo: 'Contratista', clave: 'contratista', ancho: 30 }, { titulo: 'Contrato', clave: 'contrato', ancho: 18 }, { titulo: 'Tipo', clave: 'tipo', ancho: 28 }, { titulo: 'Origen', clave: 'origen', ancho: 12 }, { titulo: 'Formularios', clave: 'formularios', ancho: 30 }, { titulo: 'Observación', clave: 'observacion', ancho: 50 }, { titulo: 'Estado', clave: 'estado', ancho: 14 }, { titulo: 'Fecha límite', clave: 'fechaLimite', formato: 'fecha', ancho: 18 }, { titulo: 'Motivo de rechazo', clave: 'motivoRechazo', ancho: 30 }] },
      ] });
      app.avisar('exito', r === 'csv' ? 'No cargó la librería de Excel: se exportó CSV de la primera hoja' : 'Excel generado');
    } catch (e) { console.error(e); app.avisar('error', `No se pudo exportar: ${e.message}`); }
  };
  const recordar = async () => {
    const pendientes = cumplimiento.filter((f) => f.pendiente);
    if (!pendientes.length) { app.avisar('info', 'No hay pendientes'); return; }
    if (!(await app.confirmar({ titulo: 'Enviar recordatorio', mensaje: `Se notificará a ${U.unicos(pendientes.map((p) => p.contratoId)).length} ${U.plural(U.unicos(pendientes.map((p) => p.contratoId)).length, 'contratista', 'contratistas')} que no han enviado en ${U.nombrePeriodo(periodo)}.`, textoOk: 'Enviar' }))) return;
    setRecordando(true);
    let ok = 0;
    for (const id of U.unicos(pendientes.map((p) => p.contratoId))) { const r = await Flujos.notificar({ evento: 'recordatorio', coleccion: 'contratos', docId: id, por: app.usuario.id }); if (r.estado === 'enviado' || r.estado === 'simulado') ok++; }
    setRecordando(false);
    app.avisar(ok ? 'exito' : 'alerta', ok ? `${ok} ${U.plural(ok, 'recordatorio enviado', 'recordatorios enviados')}` : 'No se enviaron recordatorios (revisa el flujo «notificar» en Parámetros)');
  };
  return (
    <div>
      <Encabezado titulo="Reportes" subtitulo="Envíos, cumplimiento y solicitudes del período, con exportación a Excel." acciones={<><Boton tam="sm" variante="fantasma" icono="refrescar" onClick={() => recargar()}>Actualizar</Boton><Boton tam="sm" variante="primario" icono="excel" onClick={exportar} disabled={cargando}>Exportar Excel</Boton></>} />
      <div className="grupo-filtros mb-4">
        <Campo etiqueta="Período"><Selector vacio={null} opciones={U.listaPeriodos(U.desplazarPeriodo(U.periodoActual(), -18), U.desplazarPeriodo(U.periodoActual(), 2)).reverse().map((p) => ({ valor: p, etiqueta: U.nombrePeriodo(p) }))} value={periodo} onChange={(e) => setPeriodo(e.target.value)} /></Campo>
        <Campo etiqueta="Formulario"><Selector vacio="Todos" opciones={app.formularios.filter((f) => f.tipo !== 'INFO_CONTRATO').map((f) => ({ valor: f.id, etiqueta: f.nombre }))} value={formularioId} onChange={(e) => setFormularioId(e.target.value)} /></Campo>
      </div>
      <div className="grid gap-3 grid-cols-2 md:grid-cols-4 mb-4">
        <Indicador titulo="Envíos" valor={envios.length} />
        <Indicador titulo="Aprobados" valor={envios.filter((e) => e.estado === 'aprobado').length} tipo="exito" />
        <Indicador titulo="En corrección" valor={envios.filter((e) => e.enCorreccion).length} tipo="alerta" />
        <Indicador titulo="Sin enviar" valor={cumplimiento.filter((f) => f.pendiente).length} tipo={cumplimiento.filter((f) => f.pendiente).length ? 'error' : undefined} />
      </div>
      <Pestanas activa={pestana} onCambio={setPestana} lista={[{ id: 'envios', etiqueta: 'Envíos', icono: 'envios', contador: envios.length }, { id: 'cumplimiento', etiqueta: 'Cumplimiento', icono: 'bandera', contador: cumplimiento.filter((f) => f.pendiente).length }, { id: 'solicitudes', etiqueta: 'Solicitudes', icono: 'solicitudes', contador: solicitudes.filter((s) => s.estado === 'pendiente').length }]} />
      <div className="mt-4">
        {pestana === 'envios' ? <Tabla cargando={cargando} filas={filasEnvios} vacio={<Vacio icono="envios" titulo="Sin envíos en el período" />} columnas={[
          { titulo: 'Contratista', clave: 'contratista' }, { titulo: 'Contrato', clave: 'contrato', mono: true }, { titulo: 'Formulario', clave: 'formulario' }, { titulo: 'No.', clave: 'consecutivo', mono: true },
          { titulo: 'Estado', clave: 'estado' }, { titulo: 'Enviado', render: (f) => <span className="mono text-xs">{U.fechaHora(f.enviadoEn)}</span> },
          { titulo: 'Valor cobrado', render: (f) => <span className="mono">{U.formatoCOP(f.valorCobrado)}</span> }, { titulo: 'Saldo SS', render: (f) => <span className="mono" style={f.saldo < 0 ? { color: 'var(--error)' } : undefined}>{U.formatoCOP(f.saldo)}</span> },
        ]} /> : null}
        {pestana === 'cumplimiento' ? <>
          {app.rol !== 'coordinador' ? <div className="mb-3"><Boton tam="sm" icono="correo" cargando={recordando} onClick={recordar} disabled={!cumplimiento.some((f) => f.pendiente)}>Recordar a los pendientes</Boton></div> : null}
          <Tabla cargando={cargando} filas={cumplimiento} vacio={<Vacio icono="bandera" titulo="Nada que verificar" texto="No hay contratos activos en este período o no hay formularios habilitados." />} columnas={[
            { titulo: 'Contratista', clave: 'contratista' }, { titulo: 'Contrato', clave: 'contrato', mono: true }, { titulo: 'Formulario', clave: 'formulario' },
            { titulo: 'Estado', render: (f) => (f.pendiente ? <Chip tipo="error" icono="alerta">Sin enviar</Chip> : <Chip tipo="exito" icono="check">{f.estado}</Chip>) }, { titulo: 'Enviado', render: (f) => <span className="mono text-xs">{f.enviado ? U.fechaHora(f.enviado) : '—'}</span> },
          ]} /></> : null}
        {pestana === 'solicitudes' ? <Tabla cargando={cargando} filas={filasSolicitudes} vacio={<Vacio icono="solicitudes" titulo="Sin solicitudes" />} columnas={[
          { titulo: 'Fecha', render: (f) => <span className="mono text-xs">{U.fechaHora(f.fecha)}</span> }, { titulo: 'Contratista', clave: 'contratista' }, { titulo: 'Contrato', clave: 'contrato', mono: true }, { titulo: 'Tipo', clave: 'tipo' }, { titulo: 'Estado', clave: 'estado' }, { titulo: 'Observación', clave: 'observacion' },
        ]} /> : null}
      </div>
    </div>
  );
};
</script>
<script type="text/babel" data-presets="react" data-modulo="86-admin">
/* ============================================================================
   14) admin.jsx — administración: inicio, contratistas y contratos (+ importador
       Excel), usuarios, ventanas, formularios (editor JSON + vista previa),
       catálogos y parámetros
   Estructura:
     1. Inicio del administrador
     2. Contratos: tabla, nuevo contrato, asignación de revisores/coordinadores, preRegistro
     3. Importador Excel (plantilla, validación previa, resumen, importación)
     4. Usuarios
     5. Ventanas
     6. Formularios (editor JSON)
     7. Catálogos
     8. Parámetros (+ bitácora de notificaciones)
   ============================================================================ */

/* ===== 1. Inicio ===== */
const PaginaAdminInicio = () => {
  const app = useApp();
  const { datos, cargando, recargar } = useCarga(async () => {
    const [envios, solicitudes, pre] = await Promise.all([DB.listarEnvios({ rol: 'admin', uid: app.usuario.id, periodo: app.periodo }), DB.listarSolicitudes({ rol: 'admin', uid: app.usuario.id, estado: 'pendiente' }), DB.listarPreRegistros()]);
    return { envios, solicitudes, pre };
  }, [app.periodo]);
  const envios = (datos && datos.envios) || [];
  const porEstado = U.agrupar(envios, (e) => e.estado);
  const sinActivar = ((datos && datos.pre) || []).filter((p) => !p.activado).length;
  const primerosPasos = [
    { ok: app.formularios.length > 0, texto: 'Formularios base cargados', accion: app.formularios.length ? null : <Boton tam="xs" onClick={async () => { await DB.sembrarBase(); app.avisar('exito', 'Formularios, catálogos y parámetros base creados'); app.recargarTodo(); }}>Sembrar</Boton> },
    { ok: app.parametros.nitEntidad && !String(app.parametros.nitEntidad).includes('<PENDIENTE>'), texto: 'Parámetros de la entidad (NIT, SMMLV, flujos)', accion: <Boton tam="xs" onClick={() => app.navegar('#/admin/parametros')}>Abrir</Boton> },
    { ok: app.contratos.length > 0, texto: 'Contratos y contratistas precargados', accion: <Boton tam="xs" onClick={() => app.navegar('#/admin/contratos')}>Importar</Boton> },
    { ok: !!app.ventana, texto: `Ventana de ${U.nombrePeriodo(app.periodo)}`, accion: <Boton tam="xs" onClick={() => app.navegar('#/admin/ventanas')}>Ventanas</Boton> },
  ];
  return (
    <div>
      <Encabezado titulo="Administración" subtitulo={`Resumen de ${U.nombrePeriodo(app.periodo)} · ${app.contratos.length} ${U.plural(app.contratos.length, 'contrato', 'contratos')}`} acciones={<Boton tam="sm" variante="fantasma" icono="refrescar" onClick={() => recargar()}>Actualizar</Boton>} />
      <div className="grid gap-3 grid-cols-2 md:grid-cols-4 mb-4">
        <Indicador titulo="Envíos del período" valor={cargando ? '…' : envios.length} />
        <Indicador titulo="Aprobados" valor={cargando ? '…' : (porEstado.aprobado || []).length} tipo="exito" />
        <Indicador titulo="En revisión" valor={cargando ? '…' : envios.filter((e) => ['enviado', 'en_revision', 'reenviado', 'aprobado_revisor'].includes(e.estado)).length} tipo="info" />
        <Indicador titulo="Solicitudes pendientes" valor={cargando ? '…' : ((datos && datos.solicitudes) || []).length} tipo={datos && datos.solicitudes && datos.solicitudes.length ? 'alerta' : undefined} />
      </div>
      <div className="grid gap-4 lg:grid-cols-2 items-start">
        <div className="tarjeta"><div className="tarjeta-cabecera"><h2>Puesta en marcha</h2></div><div className="tarjeta-cuerpo">
          <ul className="grid gap-2">{primerosPasos.map((p, i) => <li key={i} className="flex items-center gap-3 text-sm"><span className={`punto static inline-grid place-items-center w-6 h-6 rounded-full ${p.ok ? 'chip-exito' : 'chip-alerta'}`}><Icono nombre={p.ok ? 'check' : 'alerta'} tam={13} /></span><span className="flex-1">{p.texto}</span>{p.accion}</li>)}</ul>
          {sinActivar ? <Alerta tipo="info" className="mt-3">{sinActivar} {U.plural(sinActivar, 'contratista precargado', 'contratistas precargados')} sin activar la cuenta.</Alerta> : null}
        </div></div>
        <div className="tarjeta"><div className="tarjeta-cabecera"><h2>Estados del período</h2></div><div className="tarjeta-cuerpo">
          {cargando ? <Esqueleto filas={4} /> : (envios.length ? <ListaDatos items={Object.keys(U.ESTADOS).filter((k) => porEstado[k]).map((k) => ({ etiqueta: U.ESTADOS[k].etiqueta, valor: porEstado[k].length, mono: true }))} /> : <Vacio icono="envios" titulo="Sin envíos en el período" />)}
          <div className="flex gap-2 mt-3 flex-wrap"><Boton tam="sm" onClick={() => app.navegar('#/revision')}>Ir a revisión</Boton><Boton tam="sm" onClick={() => app.navegar('#/reportes')}>Reportes y Excel</Boton></div>
        </div></div>
      </div>
    </div>
  );
};

/* ===== 2. Contratos ===== */
const SelectorUsuarios = ({ usuarios, rol, valor, onCambio, etiqueta }) => {
  const lista = usuarios.filter((u) => u.rol === rol && u.activo !== false);
  const sel = valor || [];
  return (
    <Campo etiqueta={etiqueta} ayuda={`Usuarios con rol ${U.ROLES[rol].toLowerCase()}.`}>
      <div className="grid gap-1 max-h-48 overflow-auto p-2 rounded-md" style={{ border: '1px solid var(--borde-fuerte)' }}>
        {lista.map((u) => <label key={u.id} className="flex items-center gap-2 text-sm"><input type="checkbox" className="caja" checked={sel.includes(u.id)} onChange={(e) => onCambio(e.target.checked ? [...sel, u.id] : sel.filter((x) => x !== u.id))} />{u.nombreCompleto} <span className="texto-3 text-xs">{u.correo}</span></label>)}
        {!lista.length ? <span className="texto-3 text-sm">No hay usuarios con ese rol. Créalos en Usuarios.</span> : null}
      </div>
    </Campo>
  );
};
// Reasignar revisores/coordinadores: contrato + copias (perfil del contratista, envíos y solicitudes).
const reasignar = async (contrato, usuarios, revisores, coordinadores) => {
  const correos = (ids) => ids.map((id) => { const u = usuarios.find((x) => x.id === id); return u ? U.normalizarCorreo(u.correo) : ''; }).filter(Boolean);
  await DB.actualizarContrato(contrato.id, { revisores, coordinadores, correosRevisores: correos(revisores), correosCoordinadores: correos(coordinadores) });
  if (contrato.contratistaUid) await DB.actualizarPerfil(contrato.contratistaUid, { revisores, coordinadores }).catch(() => {});
  if (contrato.cedulaContratista) await DB.actualizarPreRegistro(contrato.cedulaContratista, { revisores, coordinadores }).catch(() => {});
  const envios = await DB.listarEnvios({ rol: 'admin', contratoId: contrato.id });
  for (const e of envios) await DB.actualizarEnvio(e.id, { revisores, coordinadores });
  const solicitudes = await DB.listarSolicitudes({ rol: 'admin', contratoId: contrato.id });
  for (const s of solicitudes) await DB.actualizarSolicitud(s.id, { revisores, coordinadores });
};
const ModalContrato = ({ contrato, usuarios, onCerrar, onGuardado }) => {
  const app = useApp();
  const [f, setF] = useState(() => (contrato ? { numero: contrato.numero, etiqueta: contrato.etiqueta || '', cedula: contrato.cedulaContratista || '', correo: contrato.correoContratista || '', nombreCompleto: (contrato.info && contrato.info.contratista && contrato.info.contratista.nombreCompleto) || '', revisores: contrato.revisores || [], coordinadores: contrato.coordinadores || [], estado: contrato.estado || 'activo' } : { numero: '', etiqueta: '', cedula: '', correo: '', nombreCompleto: '', revisores: [], coordinadores: [], estado: 'activo' }));
  const [guardando, setGuardando] = useState(false);
  const poner = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const guardar = async () => {
    const cedula = U.soloDigitos(f.cedula), correo = U.normalizarCorreo(f.correo);
    if (!f.numero.trim()) { app.avisar('alerta', 'Escribe el número del contrato'); return; }

      const id = contrato ? contrato.id : U.slug(f.numero);

      if (contrato) {
        await DB.actualizarContrato(id, { numero: f.numero.trim(), etiqueta: f.etiqueta.trim(), estado: f.estado, 'info.contratista.nombreCompleto': f.nombreCompleto.trim() });
        if (!U.igualProfundo(f.revisores, contrato.revisores || []) || !U.igualProfundo(f.coordinadores, contrato.coordinadores || [])) await reasignar(contrato, usuarios, f.revisores, f.coordinadores);
      } else {
        const existentes = await DB.buscarUsuariosPorCorreo([correo]);
        const activo = existentes.find((u) => u.rol === 'contratista' && U.soloDigitos(u.cedula) === cedula);
        await DB.crearContrato(id, {
          numero: f.numero.trim(), etiqueta: f.etiqueta.trim(), contratistaUid: activo ? activo.id : null, cedulaContratista: cedula, correoContratista: correo,
          revisores: f.revisores, coordinadores: f.coordinadores, correosRevisores: correosDe(f.revisores), correosCoordinadores: correosDe(f.coordinadores), estado: 'activo', permitirActualizar: false,
          info: { contratista: { nombreCompleto: f.nombreCompleto.trim(), cedula }, contrato: { numero: f.numero.trim() }, obligaciones: { lista: [] }, supervision: {}, modificaciones: {} },
        });
        const pre = await DB.obtenerPreRegistro(cedula);
        if (pre) await DB.actualizarPreRegistro(cedula, { correo, nombreCompleto: f.nombreCompleto.trim(), contratos: U.unicos([...(pre.contratos || []), id]), revisores: f.revisores, coordinadores: f.coordinadores });
        else await DB.guardarPreRegistro(cedula, { correo, nombreCompleto: f.nombreCompleto.trim(), contratos: [id], revisores: f.revisores, coordinadores: f.coordinadores, activado: !!activo, uid: activo ? activo.id : null });
        if (activo) await DB.actualizarPerfil(activo.id, { revisores: f.revisores, coordinadores: f.coordinadores });
      }
      app.avisar('exito', contrato ? 'Contrato actualizado' : 'Contrato creado');
      onGuardado();
    } catch (e) { app.avisar('error', DB.traducirError(e)); } finally { setGuardando(false); }
  };
  return (
    <Modal titulo={contrato ? `Editar ${contrato.numero}` : 'Nuevo contrato'} ancho="ancho" onCerrar={onCerrar} pie={<><Boton onClick={onCerrar}>Cancelar</Boton><Boton variante="primario" icono="check" cargando={guardando} onClick={guardar}>Guardar</Boton></>}>
      <div className="grid gap-4 md:grid-cols-2">
        <Campo etiqueta="Número del contrato" obligatoria ayuda={contrato ? `ID: ${contrato.id}` : 'El ID se deriva del número (sin espacios ni guiones bajos).'}><Entrada value={f.numero} onChange={poner('numero')} placeholder="P-00000 DE 2026" /></Campo>
        <Campo etiqueta="Etiqueta" ayuda="Ayuda a distinguir varios contratos del mismo contratista."><Entrada value={f.etiqueta} onChange={poner('etiqueta')} placeholder="AGOSTO 4230" /></Campo>

        <Campo etiqueta="Nombre completo" obligatoria={!contrato} className="md:col-span-2"><Entrada value={f.nombreCompleto} onChange={poner('nombreCompleto')} /></Campo>
        {contrato ? <Campo etiqueta="Estado"><Selector vacio={null} opciones={[{ valor: 'activo', etiqueta: 'Activo' }, { valor: 'terminado', etiqueta: 'Terminado' }]} value={f.estado} onChange={poner('estado')} /></Campo> : null}

  );

const COLUMNAS_IMPORT = ['cedula', 'correo', 'nombres', 'apellidos', 'telefono', 'numeroContrato', 'etiqueta', 'fechaInicio', 'fechaFin', 'valorTotal', 'valorMensual', 'objeto', 'componente', 'equipo', 'supervisor', 'validador', 'rolProceso', 'cdp', 'rp', 'plazoDias', 'correosRevisores', 'correosCoordinadores', 'obligaciones'];
const aISOImport = (v) => {
  if (!v && v !== 0) return '';
  // SheetJS entrega las fechas a medianoche local; si vienen en UTC (otra zona) se usan los getters UTC.
  if (U.esFecha(v)) {
    const local = v.getHours() === 0 && v.getMinutes() === 0;
    return local ? U.isoDePartes(v.getFullYear(), v.getMonth() + 1, v.getDate()) : U.isoDePartes(v.getUTCFullYear(), v.getUTCMonth() + 1, v.getUTCDate());
  }
  const s = String(v).trim();
  if (U.esISO(s)) return s;
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
  if (m) return U.isoDePartes(+m[3], +m[2], +m[1]);
  if (/^\d{5}$/.test(s)) { const d = new Date(Date.UTC(1899, 11, 30) + Number(s) * 86400000); return aISOImport(d); }
  return s;
};

    const revisoresPorCorreo = {}; usuarios.forEach((u) => { revisoresPorCorreo[U.normalizarCorreo(u.correo)] = u; });
    return lista.map((f, i) => {
      const errores = [];
      const cedula = U.soloDigitos(f.cedula);
      const correo = U.normalizarCorreo(f.correo);
      if (cedula.length < 5) errores.push('cédula inválida');
      if (!U.esCorreo(correo)) errores.push('correo inválido');

      if (!String(f.numeroContrato || '').trim()) errores.push('numeroContrato obligatorio');

      app.avisar(res.errores.length ? 'alerta' : 'exito', `Importación terminada: ${res.contratosCreados} creados, ${res.contratosActualizados} actualizados${res.errores.length ? `, ${res.errores.length} con error` : ''}`);
      alTerminar();
    } catch (e) { app.avisar('error', DB.traducirError(e)); } finally { setImportando(false); setProgreso(''); }
  };

  return (
    <div className="grid gap-4">
      <div className="tarjeta"><div className="tarjeta-cuerpo grid gap-3">

        </div>
      </div></div>
      {filas ? (
        <div className="tarjeta">
          <div className="tarjeta-cabecera"><h2>Validación previa</h2><div className="flex gap-2 items-center"><Chip tipo="exito">{filas.length - conError} válidas</Chip>{conError ? <Chip tipo="error">{conError} con errores</Chip> : null}</div></div>
          <div className="tarjeta-cuerpo">
            <Tabla filas={filas} claveFila={(f) => f.fila} columnas={[
              { titulo: 'Fila', clave: 'fila', mono: true }, { titulo: 'Contrato', render: (f) => <span className="mono">{f.numeroContrato}</span> }, { titulo: 'Cédula', clave: 'cedula', mono: true }, { titulo: 'Contratista', render: (f) => `${f.nombres} ${f.apellidos}` }, { titulo: 'Correo', clave: 'correo' },
              { titulo: 'Obligaciones', render: (f) => f.obligaciones.length }, { titulo: 'Resultado', render: (f) => (f.errores.length ? <span className="text-xs" style={{ color: 'var(--error)' }}>{f.errores.join(' · ')}</span> : <Chip tipo="exito" icono="check">Lista</Chip>) },

  });
  const [guardando, setGuardando] = useState(false);

/* ===== 6. Formularios ===== */
const TIPOS_PREGUNTA = ['TEXTO', 'TEXTO_LARGO', 'NUMERO', 'MONEDA', 'PORCENTAJE', 'FECHA', 'SELECCION_UNICA', 'SELECCION_MULTIPLE', 'SI_NO', 'CALCULADA', 'COMPUESTA', 'ARCHIVO', 'URL', 'TELEFONO', 'CORREO', 'SEPARADOR'];
const validarEsquema = (f) => {
  const p = [];
  if (!f || typeof f !== 'object') return ['El JSON debe ser un objeto'];
  if (!f.id || !/^[a-z0-9_]+$/.test(f.id)) p.push('id: obligatorio, solo minúsculas, números y guion bajo');
  if (!f.nombre) p.push('nombre: obligatorio');
  if (!['INFO_CONTRATO', 'INFORME_MENSUAL', 'CUENTA_COBRO', 'GENERICO'].includes(f.tipo)) p.push('tipo: INFO_CONTRATO | INFORME_MENSUAL | CUENTA_COBRO | GENERICO');
  if (!f.config || typeof f.config !== 'object') p.push('config: obligatorio');
  else if (!Array.isArray(f.config.flujoEstados)) p.push('config.flujoEstados: debe ser una lista (puede ser vacía)');
  if (!Array.isArray(f.capitulos) || !f.capitulos.length) p.push('capitulos: al menos uno');
  const ids = new Set();
  (f.capitulos || []).forEach((c, i) => {
    if (!c.id) p.push(`capítulo ${i + 1}: sin id`);
    if (!c.nombre) p.push(`capítulo ${c.id || i + 1}: sin nombre`);
    (c.preguntas || []).forEach((q, j) => {
      const ref = `${c.id}/${q.id || `#${j + 1}`}`;
      if (!q.id) p.push(`${ref}: sin id`);
      else if (ids.has(q.id)) p.push(`${ref}: id repetido`); else ids.add(q.id);
      if (!q.etiqueta && q.tipo !== 'SEPARADOR') p.push(`${ref}: sin etiqueta`);
      if (!TIPOS_PREGUNTA.includes(q.tipo)) p.push(`${ref}: tipo desconocido «${q.tipo}»`);
      if (q.tipo === 'COMPUESTA') {
        if (!Array.isArray(q.subpreguntas) || !q.subpreguntas.length) p.push(`${ref}: COMPUESTA sin subpreguntas`);
        const sids = new Set();
        (q.subpreguntas || []).forEach((s) => { if (!s.id) p.push(`${ref}: subpregunta sin id`); else if (sids.has(s.id)) p.push(`${ref}.${s.id}: id repetido`); else sids.add(s.id); if (!TIPOS_PREGUNTA.includes(s.tipo)) p.push(`${ref}.${s.id}: tipo desconocido`); });
      }
      if ((q.tipo === 'SELECCION_UNICA' || q.tipo === 'SELECCION_MULTIPLE') && !Array.isArray(q.opciones) && !q.origenOpciones) p.push(`${ref}: faltan opciones u origenOpciones`);
    });
  });
  return p.concat(Formulas.validarFormulario(f));
};
const EditorFormulario = ({ formulario, onCerrar, onGuardado }) => {
  const app = useApp();
  const [texto, setTexto] = useState(() => JSON.stringify(formulario, null, 2));
  const [guardando, setGuardando] = useState(false);
  const [verPrevia, setVerPrevia] = useState(true);
  const analisis = useMemo(() => { try { const f = JSON.parse(texto); return { f, problemas: validarEsquema(f) }; } catch (e) { return { f: null, problemas: [`JSON inválido: ${e.message}`] }; } }, [texto]);
  const ctxPrevia = useMemo(() => ({ usuario: app.usuario, contrato: app.contrato || { info: {} }, parametros: app.parametros, catalogos: app.catalogos, periodo: U.rangoPeriodo(app.periodo), consecutivo: 1 }), [app.usuario, app.contrato, app.parametros, app.catalogos, app.periodo]);
  const guardar = async (publicar) => {
    if (!analisis.f || analisis.problemas.length) { app.avisar('alerta', 'Corrige los problemas antes de guardar'); return; }
    if (analisis.f.id !== formulario.id && app.formularios.some((x) => x.id === analisis.f.id)) { app.avisar('alerta', 'Ya existe un formulario con ese id'); return; }
    setGuardando(true);
    try {
      if (publicar) { const v = await DB.publicarVersion(analisis.f); app.avisar('exito', `Versión ${v} publicada`); }
      else { await DB.guardarFormulario({ ...analisis.f, version: formulario.version || analisis.f.version || 1 }); app.avisar('exito', 'Formulario guardado'); }
      onGuardado();
    } catch (e) { app.avisar('error', DB.traducirError(e)); } finally { setGuardando(false); }
  };
  return (
    <div>
      <Encabezado titulo={`Editar · ${formulario.nombre}`} subtitulo={`id ${formulario.id} · versión ${formulario.version || 1}`} migas={[{ texto: 'Formularios', onClick: onCerrar }, { texto: 'Editar' }]}
        acciones={<><Boton onClick={onCerrar}>Volver</Boton><Boton icono="check" cargando={guardando} onClick={() => guardar(false)} disabled={analisis.problemas.length > 0}>Guardar</Boton><Boton variante="primario" icono="subir" cargando={guardando} onClick={() => guardar(true)} disabled={analisis.problemas.length > 0}>Publicar versión</Boton></>} />
      <div className="grid gap-4 xl:grid-cols-2 items-start">
        <div className="grid gap-3">
          <Area className="editor-json" autoAlto={false} value={texto} onChange={(e) => setTexto(e.target.value)} spellCheck={false} aria-label="JSON del formulario" />
          {analisis.problemas.length ? <Alerta tipo="error"><strong>{analisis.problemas.length} {U.plural(analisis.problemas.length, 'problema', 'problemas')}</strong><ul className="text-xs mt-1 grid gap-0.5">{analisis.problemas.map((p, i) => <li key={i}>{p}</li>)}</ul></Alerta> : <Alerta tipo="exito">Esquema y fórmulas válidos.</Alerta>}
          <div className="flex gap-2 flex-wrap"><Boton tam="xs" onClick={() => { try { setTexto(JSON.stringify(JSON.parse(texto), null, 2)); } catch (e) { app.avisar('error', 'JSON inválido'); } }}>Formatear</Boton><Boton tam="xs" onClick={() => { const s = SEMILLAS.formularios.find((x) => x.id === formulario.id); if (s) setTexto(JSON.stringify(s, null, 2)); else app.avisar('info', 'Este formulario no tiene semilla'); }}>Restaurar semilla</Boton><Boton tam="xs" onClick={() => U.descargarTexto(texto, `${formulario.id}.json`, 'application/json')}>Descargar JSON</Boton></div>
        </div>
        <div>

};

const PaginaAdminCatalogos = () => {

  const nuevo = () => abrir({ id: `catalogo_${U.idAleatorio().slice(0, 6)}`, nombre: 'Nuevo catálogo', opciones: [] });
