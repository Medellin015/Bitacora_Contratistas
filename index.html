<script data-modulo="flujos">
'use strict';
/* ============================================================================
   5) flujos.js — Power Automate (window.Flujos): subirArchivo · notificar · docxAPdf
   Convención: POST con Content-Type text/plain y cuerpo JSON (sin preflight CORS).
   Las URL viven en parametros/app.flujos; si una está vacía la app avisa y no falla.
   El flujo valida el idToken con accounts:lookup y lee Firestore con ese token:
   nunca confía en lo que diga el cliente (ver docs/flujos.md en el README).
   Estructura:
     1. Configuración y llamada genérica
     2. subirArchivo (un POST por archivo, máx. 15 MB)
     3. notificar (correos; cada intento queda en `notificaciones`)
     4. docxAPdf (opcional)
   ============================================================================ */
(function (raiz) {
  const U = raiz.U;

  /* ===== 1. Configuración ===== */
  let parametros = {};
  const configurar = (p) => { parametros = p || {}; };
  const urlDe = (nombre) => String(((parametros.flujos || {})[nombre]) || '').trim();
  const disponible = (nombre) => /^https:\/\//i.test(urlDe(nombre));

  const llamar = async (nombre, cuerpo, { tiempoMs = 120000 } = {}) => {
    const url = urlDe(nombre);
    if (!disponible(nombre)) { const e = new Error(`El flujo «${nombre}» no está configurado en Parámetros`); e.code = 'flujo-sin-url'; throw e; }
    const control = new AbortController();
    const temporizador = setTimeout(() => control.abort(), tiempoMs);
    try {
      const idToken = await raiz.Auth.idToken();
      const respuesta = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ idToken, ...cuerpo }), signal: control.signal });
      const texto = await respuesta.text();
      let json;
      try { json = texto ? JSON.parse(texto) : {}; } catch (e) { json = { ok: respuesta.ok, mensaje: texto }; }
      if (!respuesta.ok || json.ok === false) {
        const e = new Error(json.mensaje || json.error || `El flujo «${nombre}» respondió ${respuesta.status}`);
        e.code = `flujo-${respuesta.status}`;
        throw e;
      }
      return json;
    } catch (e) {
      if (e.name === 'AbortError') { const t = new Error(`El flujo «${nombre}» no respondió a tiempo`); t.code = 'flujo-tiempo'; throw t; }
      throw e;
    } finally { clearTimeout(temporizador); }
  };

  /* ===== 2. subirArchivo ===== */
  // origen: 'borrador' | 'envio'; docId: ID del borrador o envío (la app guarda el
  // borrador ANTES de subir, para que el flujo lea uid/contrato/formulario/período).
  const subirArchivo = async ({ origen, docId, preguntaId, archivo, maxMB = 15 }) => {
    if (archivo.size > maxMB * 1048576) { const e = new Error(`El archivo supera ${maxMB} MB`); e.code = 'archivo-grande'; throw e; }
    const nombre = U.sanearNombreArchivo(archivo.name) || 'archivo';
    if (raiz.MODO_DEMO) {
      // Demostración: no hay SharePoint; se simula la respuesta del flujo.
      await U.esperar(300);
      return { ok: true, url: `https://demo.local/Contratistas/${encodeURIComponent(nombre)}`, id: U.idAleatorio(), nombre, tamano: archivo.size, simulado: true };
    }
    const base64 = await U.leerArchivoBase64(archivo);
    const r = await llamar('subirArchivo', { origen, docId, preguntaId, nombre, tipo: archivo.type || 'application/octet-stream', base64 }, { tiempoMs: 180000 });
    return { ok: true, url: r.url || '', id: r.id || '', nombre, tamano: archivo.size };
  };

  /* ===== 3. notificar ===== */
  // La app solo indica evento y documento; destinatarios y HTML los arma el flujo.
  const notificar = async ({ evento, coleccion, docId, por }) => {
    let estado = 'enviado', error = null;
    try {
      if (raiz.MODO_DEMO) estado = 'simulado';
      else if (!disponible('notificar')) { estado = 'omitido'; error = 'Flujo «notificar» sin configurar'; }
      else await llamar('notificar', { evento, coleccion, docId });
    } catch (e) { estado = 'fallido'; error = e.message; }
    try { await raiz.DB.registrarNotificacion({ evento, coleccion, docId, por: por || null, estado, error }); }
    catch (e) { console.warn('No se pudo registrar la notificación:', e); }
    return { estado, error };
  };

  /* ===== 4. docxAPdf ===== */
  const docxAPdf = async ({ nombre, blob }) => {
    if (blob.size > 10 * 1048576) { const e = new Error('El Word supera 10 MB; no se puede convertir a PDF'); e.code = 'archivo-grande'; throw e; }
    const base64 = U.base64DeArrayBuffer(await blob.arrayBuffer());
    const r = await llamar('docxAPdf', { nombre, base64 }, { tiempoMs: 180000 });
    if (!r.base64Pdf) throw new Error('El flujo no devolvió el PDF');
    return new Blob([U.uint8DeBase64(r.base64Pdf)], { type: 'application/pdf' });
  };

  raiz.Flujos = { configurar, disponible, urlDe, llamar, subirArchivo, notificar, docxAPdf };
})(window);
</script>
<script data-modulo="informe-docx">
'use strict';
/* ============================================================================
   informe-docx.js — Generador del "Informe mensual" en Word (formato ITM – SIF)
   Réplica del modelo "INFORME DE GESTION ITMSIF - <nombre> - No. N <Mes> <Año>.docx"
   usando docx.js 9.x (navegador: <script src="https://cdn.jsdelivr.net/npm/docx@9.8.1/dist/index.iife.js">
   expone window.docx; Node: require('docx')).

   Estructura del archivo:
     1. Constantes del formato (medidas tomadas del .docx modelo)
     2. Utilidades de texto y fechas (es-CO)
     3. Bloques reutilizables (celdas, párrafos, hipervínculos)
     4. Encabezado y pie de página (imágenes flotantes)
     5. Tablas del informe (datos, actividades, dificultades, observaciones,
        firmas, anexos)
     6. API pública (window.InformeDocx): construirInformeDocx(), nombreArchivoInforme(),
        fechaLarga(), textoPeriodo(), encabezadoPie(), bloques(), FORMATO_DEFAULT
   ============================================================================ */
(function (raiz) {

  /* ===== 1. Constantes del formato ===== */
  // Unidades: dxa/twips (1/20 pt) para tablas y márgenes; EMU para imágenes
  // flotantes (914400 EMU = 1 pulgada). docx.js recibe el tamaño de imagen en
  // píxeles a 96 ppp (1 px = 9525 EMU), por eso se convierte.
  const FORMATO_DEFAULT = {
    fuente: 'Arial Narrow',
    tamEtiqueta: 23,            // medios puntos → 11,5 pt (etiquetas en negrilla)
    tamValor: 22,               // 11 pt (valores y textos)
    pagina: { ancho: 12240, alto: 15840 },             // Carta
    margenes: { top: 1702, right: 1701, bottom: 1134, left: 1701, header: 708, footer: 708 },
    tablaPrincipal: { ancho: 10532, sangria: -431, columnas: [3409, 1241, 5882], margenCelda: 70 },
    tablaUnaColumna: { ancho: 9782, sangria: -431 },
    tablaDosColumnas: { ancho: 9209, columnas: [3964, 5245] },
    colorHipervinculo: '0563C1',
    encabezado: { anchoEmu: 7740638, altoEmu: 775992, offsetXEmu: -1264920, offsetYEmu: -282575 },
    pie: { anchoEmu: 7808997, altoEmu: 1317404, offsetYEmu: 477429,
      espaciadorAnchoEmu: 45719, espaciadorAltoEmu: 914375, tabDerecha: 8646, sangriaFrancesa: 1350 },
    firma: { anchoMaxEmu: 2152950, altoMaxEmu: 371527 },
    textoNoEjecutada: 'Actividad no ejecutada durante el período reportado',
    textoVacio: 'NINGUNA',
  };
  const EMU_POR_PX = 9525;
  // PNG 1×1 transparente. El modelo trae en el pie una imagen invisible de
  // 0,05" × 1" en línea: es lo que hace alto el pie y sube el borde inferior
  // del cuerpo para que el texto no se monte sobre la franja ITM/Alcaldía.
  const PNG_TRANSPARENTE_B64 = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP4//8/AwAI/AL+eMSysAAAAABJRU5ErkJggg==';
  const bytesDeBase64 = (b64) => {
    if (typeof atob === 'function') return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    return Uint8Array.from(Buffer.from(b64, 'base64'));
  };
  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio',
    'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

  /* ===== 2. Utilidades de texto y fechas ===== */
  // Fechas ISO 'AAAA-MM-DD' → partes numéricas sin pasar por Date (evita el
  // desfase de zona horaria UTC-5 que corre el día).
  const partesFecha = (iso) => {
    const [a, m, d] = String(iso).slice(0, 10).split('-').map(Number);
    return { a, m, d };
  };
  const fechaLarga = (iso) => {
    const { a, m, d } = partesFecha(iso);
    return `${d} de ${MESES[m - 1]} de ${a}`;
  };
  // "Del 1 de septiembre al 30 de septiembre de 2026"; si cruza de año, ambos años.
  const textoPeriodo = (desdeIso, hastaIso) => {
    const x = partesFecha(desdeIso), y = partesFecha(hastaIso);
    const ini = x.a === y.a ? `${x.d} de ${MESES[x.m - 1]}` : fechaLarga(desdeIso);
    return `Del ${ini} al ${fechaLarga(hastaIso)}`;
  };
  const capitalizar = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  // Sin redondear: docx.js hace Math.round(px × 9525), así el XML conserva
  // exactamente los EMU del modelo (redondear a px entero los corre unos EMU).
  const pxDeEmu = (emu) => emu / EMU_POR_PX;
  const REGEX_URL = /(https?:\/\/[^\s<>"«»]+)/g;

  /* ===== 3. Bloques reutilizables ===== */
  function crearBloques(D, F) {
    const { Paragraph, TextRun, TableCell, ExternalHyperlink, AlignmentType,
      VerticalAlign, BorderStyle, ShadingType } = D;

    const borde = { style: BorderStyle.SINGLE, size: 4, color: '000000' };
    const bordes = { top: borde, bottom: borde, left: borde, right: borde };
    const bordesTabla = { ...bordes, insideHorizontal: borde, insideVertical: borde };

    const run = (text, o = {}) => new TextRun({
      text, font: F.fuente, size: o.size || F.tamValor, bold: !!o.bold,
    });

    // Una línea de texto → runs; las URL se vuelven hipervínculos azules subrayados.
    const runsConEnlaces = (linea, o = {}) => {
      const partes = String(linea).split(REGEX_URL).filter((p) => p !== '');
      return partes.map((p) => (/^https?:\/\//.test(p)
        ? new ExternalHyperlink({
          link: p,
          children: [new TextRun({ text: p, font: F.fuente, size: o.size || F.tamValor,
            color: F.colorHipervinculo, underline: {} })],
        })
        : run(p, o)));
    };

    // Texto multilínea → un párrafo por línea (así está en el modelo). Las
    // líneas que son solo una URL van sin justificar, como en el modelo.
    const parrafos = (texto, o = {}) => {
      const lineas = String(texto || '').split(/\r?\n/).filter((l) => l.trim() !== '');
      if (!lineas.length) lineas.push('');
      return lineas.map((l) => new Paragraph({
        alignment: /^\s*https?:\/\/\S+\s*$/.test(l) ? AlignmentType.LEFT : (o.alignment || AlignmentType.LEFT),
        indent: o.indent,
        children: runsConEnlaces(l.trim(), o),
      }));
    };

    const celda = (children, o = {}) => new TableCell({
      children,
      columnSpan: o.columnSpan,
      width: o.width ? { size: o.width, type: D.WidthType.DXA } : undefined,
      verticalAlign: o.verticalAlign === undefined ? VerticalAlign.CENTER : o.verticalAlign,
      borders: bordes,
      shading: o.blanco ? { type: ShadingType.CLEAR, color: 'auto', fill: 'FFFFFF' } : undefined,
    });

    return { borde, bordes, bordesTabla, run, runsConEnlaces, parrafos, celda };
  }

  /* ===== 4. Encabezado y pie de página ===== */
  function crearEncabezadoPie(D, F, imagenes) {
    const { Header, Footer, Paragraph, ImageRun, TextRun, HorizontalPositionRelativeFrom,
      VerticalPositionRelativeFrom, HorizontalPositionAlign, TextWrappingType, TabStopType } = D;
    const enc = F.encabezado, pie = F.pie;

    const header = new Header({
      children: [new Paragraph({
        indent: { firstLine: 708 },
        children: imagenes.encabezado ? [new ImageRun({
          type: imagenes.tipoEncabezado || 'jpg',
          data: imagenes.encabezado,
          transformation: { width: pxDeEmu(enc.anchoEmu), height: pxDeEmu(enc.altoEmu) },
          floating: {
            horizontalPosition: { relative: HorizontalPositionRelativeFrom.MARGIN, offset: enc.offsetXEmu },
            verticalPosition: { relative: VerticalPositionRelativeFrom.PARAGRAPH, offset: enc.offsetYEmu },
            allowOverlap: true, behindDocument: false,
            wrap: { type: TextWrappingType.NONE },
          },
        })] : [],
      })],
    });

    // Pie = misma estructura del modelo: imagen flotante detrás del texto,
    // alineada a la derecha de la página y anclada 1,33 cm bajo el párrafo,
    // más un espaciador transparente en línea de 1" de alto (ver PNG_TRANSPARENTE_B64).
    const footer = new Footer({
      children: [
        new Paragraph({
          tabStops: [{ type: TabStopType.RIGHT, position: pie.tabDerecha }],
          indent: { hanging: pie.sangriaFrancesa },
          children: [
            ...(imagenes.pie ? [new ImageRun({
              type: imagenes.tipoPie || 'jpg',
              data: imagenes.pie,
              transformation: { width: pxDeEmu(pie.anchoEmu), height: pxDeEmu(pie.altoEmu) },
              floating: {
                horizontalPosition: { relative: HorizontalPositionRelativeFrom.PAGE, align: HorizontalPositionAlign.RIGHT },
                verticalPosition: { relative: VerticalPositionRelativeFrom.PARAGRAPH, offset: pie.offsetYEmu },
                allowOverlap: true, behindDocument: true,
                wrap: { type: TextWrappingType.NONE },
              },
            })] : []),
            new ImageRun({
              type: 'png',
              data: bytesDeBase64(PNG_TRANSPARENTE_B64),
              transformation: { width: pxDeEmu(pie.espaciadorAnchoEmu), height: pxDeEmu(pie.espaciadorAltoEmu) },
            }),
            new TextRun({ children: [new D.Tab(), new D.Tab()] }),
          ],
        }),
        new Paragraph({ children: [] }),
      ],
    });
    return { header, footer };
  }

  /* ===== 5. Tablas del informe ===== */
  function crearTablas(D, F, B, d, imagenes) {
    const { Table, TableRow, Paragraph, ImageRun, WidthType, AlignmentType,
      TableLayoutType, HeightRule } = D;
    const TP = F.tablaPrincipal;
    const [c0, c1, c2] = TP.columnas;
    const fila = (cells, alto) => new TableRow({
      children: cells,
      height: alto ? { value: alto, rule: HeightRule.ATLEAST } : undefined,
    });
    const etiqueta = (t, o = {}) => new Paragraph({ alignment: o.alignment, indent: o.indent,
      children: [B.run(t, { bold: true, size: F.tamEtiqueta })] });

    // 5.1 Tabla principal: título + datos del contrato + actividades
    const filaDato = (lbl, valor, o = {}) => fila([
      B.celda([etiqueta(lbl)], { columnSpan: 2, width: c0 + c1 }),
      B.celda(o.negrilla
        ? [new Paragraph({ alignment: o.alignment, children: [B.run(valor, { bold: true })] })]
        : B.parrafos(valor, { alignment: o.alignment }), { width: c2 }),
    ], o.alto || 355);

    const filasActividades = (d.actividades || []).map((a) => {
      const pct = Number(a.porcentaje) || 0;
      const descripcion = pct === 0 && !String(a.descripcion || '').trim() ? F.textoNoEjecutada : a.descripcion;
      return fila([
        B.celda([new Paragraph({ alignment: AlignmentType.JUSTIFIED, children: [
          B.run(`Actividad ${a.numero}. `, { bold: true }), ...B.runsConEnlaces(a.obligacion || ''),
        ] })], { width: c0 }),
        B.celda([new Paragraph({ alignment: AlignmentType.CENTER, children: [B.run(`${pct}%`)] })], { width: c1 }),
        B.celda(B.parrafos(descripcion, { alignment: AlignmentType.JUSTIFIED }), { width: c2 }),
      ], 281);
    });

    const tablaPrincipal = new Table({
      width: { size: TP.ancho, type: WidthType.DXA },
      columnWidths: TP.columnas,
      indent: { size: TP.sangria, type: WidthType.DXA },
      layout: TableLayoutType.FIXED,
      margins: { left: TP.margenCelda, right: TP.margenCelda },
      borders: B.bordesTabla,
      rows: [
        fila([B.celda([etiqueta(`INFORME MENSUAL No. ${d.numeroInforme}`, { alignment: AlignmentType.CENTER })],
          { columnSpan: 3, width: TP.ancho })], 183),
        filaDato('Fecha de elaboración del informe', fechaLarga(d.fechaElaboracion), { alto: 332 }),
        // Alturas mínimas copiadas del modelo (50 = "lo que pida el texto").
        filaDato('Nombres y apellidos', String(d.contratista.nombreCompleto).toUpperCase(), { negrilla: true, alto: 50 }),
        filaDato('Número del Contrato', d.contrato.numero, { alto: 50 }),
        filaDato('Objeto de contrato', d.contrato.objeto, { alignment: AlignmentType.JUSTIFIED, alto: 558 }),
        filaDato('Componente del proyecto al que pertenece', d.contrato.componente, { alignment: AlignmentType.JUSTIFIED, alto: 277 }),
        filaDato('Equipo o Unidad al que pertenece', d.contrato.equipo),
        filaDato('Período de reporte', textoPeriodo(d.periodo.desde, d.periodo.hasta)),
        filaDato('Supervisor ITM', d.contrato.supervisor),
        fila([
          B.celda([etiqueta('ACTIVIDADES PROGRAMADAS/CONTRACTUALES', { alignment: AlignmentType.CENTER })], { width: c0, blanco: true }),
          B.celda([etiqueta('% EJECUCION', { alignment: AlignmentType.CENTER })], { width: c1, blanco: true }),
          B.celda([etiqueta('DESCRIPCIÓN DE ACTIVIDADES REALIZADAS', { alignment: AlignmentType.CENTER })], { width: c2, blanco: true }),
        ], 300),
        ...filasActividades,
      ],
    });

    // 5.2 Tablas de una columna (dificultades / observaciones)
    const TU = F.tablaUnaColumna;
    const tablaTexto = (titulo, texto) => new Table({
      width: { size: TU.ancho, type: WidthType.DXA },
      columnWidths: [TU.ancho],
      indent: { size: TU.sangria, type: WidthType.DXA },
      layout: TableLayoutType.FIXED,
      borders: B.bordesTabla,
      rows: [
        fila([B.celda([etiqueta(titulo, { alignment: AlignmentType.CENTER })], { width: TU.ancho, blanco: true, verticalAlign: null })]),
        fila([B.celda(B.parrafos(String(texto || '').trim() || F.textoVacio), { width: TU.ancho, verticalAlign: null })]),
      ],
    });

    // 5.3 Tabla de firmas
    // Mejora frente al modelo: el bloque de firmas no se parte entre páginas
    // (keepNext en cada párrafo + filas que no se dividen).
    const T2 = F.tablaDosColumnas;
    const [k0, k1] = T2.columnas;
    const sangria = { left: -80 };
    const filaFirma = (lbl, contenido, alto) => new TableRow({
      cantSplit: true,
      height: { value: alto, rule: HeightRule.ATLEAST },
      children: [
        B.celda([new Paragraph({ alignment: AlignmentType.JUSTIFIED, indent: sangria, keepNext: true,
          children: [B.run(lbl, { bold: true, size: F.tamEtiqueta })] })], { width: k0 }),
        B.celda(contenido, { width: k1 }),
      ],
    });
    const firmaImg = (() => {
      if (!imagenes.firma) return [new Paragraph({ indent: sangria, keepNext: true, children: [] })];
      // Mantiene la proporción dentro del recuadro máximo del modelo.
      const { anchoMaxEmu, altoMaxEmu } = F.firma;
      const ratio = imagenes.firmaAncho && imagenes.firmaAlto ? imagenes.firmaAncho / imagenes.firmaAlto : anchoMaxEmu / altoMaxEmu;
      let w = anchoMaxEmu, h = w / ratio;
      if (h > altoMaxEmu) { h = altoMaxEmu; w = h * ratio; }
      return [new Paragraph({ indent: sangria, keepNext: true, children: [new ImageRun({
        type: imagenes.tipoFirma || 'png', data: imagenes.firma,
        transformation: { width: pxDeEmu(w), height: pxDeEmu(h) },
      })] })];
    })();
    const tablaFirmas = new Table({
      width: { size: T2.ancho, type: WidthType.DXA },
      columnWidths: T2.columnas,
      alignment: AlignmentType.CENTER,
      layout: TableLayoutType.FIXED,
      borders: B.bordesTabla,
      rows: [
        filaFirma('Nombres y apellidos Contratista', [new Paragraph({ indent: sangria, keepNext: true, children: [B.run(String(d.contratista.nombreCompleto).toUpperCase())] })], 351),
        filaFirma('Rol en el proceso', [new Paragraph({ indent: sangria, keepNext: true, alignment: AlignmentType.JUSTIFIED, children: [B.run(d.contratista.rol || '')] })], 408),
        filaFirma('Firma del contratista', firmaImg, 408),
        filaFirma('Nombre y Apellidos del validador', [new Paragraph({ indent: sangria, keepNext: true, children: [B.run(d.contrato.validador || '', { bold: true, size: F.tamEtiqueta })] })], 408),
        // En el modelo la etiqueta Vo.Bo. va entre dos párrafos vacíos: deja
        // la fila alta para la firma manuscrita del validador.
        new TableRow({
          cantSplit: true,
          height: { value: 460, rule: HeightRule.ATLEAST },
          children: [
            B.celda([
              new Paragraph({ indent: sangria, children: [B.run('', { size: F.tamEtiqueta })] }),
              etiqueta('Vo.Bo. VALIDADOR', { alignment: AlignmentType.JUSTIFIED, indent: sangria }),
              new Paragraph({ indent: sangria, children: [B.run('', { size: F.tamEtiqueta })] }),
            ], { width: k0 }),
            B.celda([new Paragraph({ children: d.voBoTexto ? [B.run(d.voBoTexto)] : [] })], { width: k1 }),
          ],
        }),
      ],
    });

    // 5.4 Tabla de anexos
    const filasAnexos = (d.anexos || []).map((x, i) => fila([
      B.celda([new Paragraph({ indent: sangria, children: [B.run(`${i + 1}. ${x.nombre}`)] })], { width: k0 }),
      B.celda([
        new Paragraph({ indent: sangria, children: [B.run(x.ruta || '')] }),
        ...(x.url ? [new Paragraph({ indent: sangria, children: B.runsConEnlaces(x.url) })] : []),
      ], { width: k1 }),
    ], 408));
    const tablaAnexos = new Table({
      width: { size: T2.ancho, type: WidthType.DXA },
      columnWidths: T2.columnas,
      alignment: AlignmentType.CENTER,
      layout: TableLayoutType.FIXED,
      borders: B.bordesTabla,
      rows: [
        fila([
          B.celda([new Paragraph({ indent: sangria, children: [B.run('Anexo', { bold: true })] })], { width: k0 }),
          B.celda([new Paragraph({ indent: sangria, children: [B.run('Ruta', { bold: true })] })], { width: k1 }),
        ], 408),
        ...filasAnexos,
      ],
    });

    return { tablaPrincipal, tablaTexto, tablaFirmas, tablaAnexos };
  }

  /* ===== 6. API pública ===== */
  /**
   * Construye el Document de docx.js con el formato del modelo.
   * @param {object} d  Datos: { numeroInforme, fechaElaboracion:'AAAA-MM-DD',
   *   periodo:{desde,hasta}, contratista:{nombreCompleto, rol},
   *   contrato:{numero, objeto, componente, equipo, supervisor, validador},
   *   actividades:[{numero, obligacion, porcentaje, descripcion}],
   *   dificultades, observaciones, anexos:[{nombre, ruta, url}], voBoTexto? }
   * @param {object} imagenes { encabezado, pie, firma: Uint8Array|ArrayBuffer,
   *   firmaAncho, firmaAlto (px reales de la firma, para conservar proporción) }
   * @param {object} D  Librería docx (window.docx o require('docx'))
   * @param {object} formato  Sobrescrituras opcionales de FORMATO_DEFAULT
   */
  function construirInformeDocx(d, imagenes = {}, D = raiz.docx, formato = {}) {
    if (!D) throw new Error('No se cargó la librería docx.js');
    const F = { ...FORMATO_DEFAULT, ...formato };
    const B = crearBloques(D, F);
    const { header, footer } = crearEncabezadoPie(D, F, imagenes);
    const T = crearTablas(D, F, B, d, imagenes);
    const { Document, Paragraph } = D;
    const espacio = () => new Paragraph({ children: [B.run('', { size: F.tamEtiqueta })] });

    return new Document({
      creator: d.contratista.nombreCompleto,
      title: `Informe mensual No. ${d.numeroInforme}`,
      description: `Informe de ejecución mensual — ${textoPeriodo(d.periodo.desde, d.periodo.hasta)}`,
      styles: {
        default: {
          document: {
            run: { font: F.fuente, size: F.tamValor },
            // lineRule AUTO explícito: sin él LibreOffice lo toma como "exacto"
            // (12 pt fijos) y las líneas quedan más apretadas que en el modelo.
            paragraph: { spacing: { before: 0, after: 0, line: 240, lineRule: D.LineRuleType.AUTO } },
          },
        },
      },
      sections: [{
        properties: {
          page: {
            size: { width: F.pagina.ancho, height: F.pagina.alto },
            margin: F.margenes,
          },
        },
        headers: { default: header },
        footers: { default: footer },
        children: [
          T.tablaPrincipal,
          espacio(),
          T.tablaTexto('PRINCIPALES DIFICULTADES ENCONTRADAS', d.dificultades),
          espacio(), espacio(),
          T.tablaTexto('PRINCIPALES OBSERVACIONES ENCONTRADAS', d.observaciones),
          espacio(),
          T.tablaFirmas,
          espacio(),
          new Paragraph({ keepNext: true, children: [B.run('Anexos del Informe:', { bold: true })] }),
          T.tablaAnexos,
          new Paragraph({ children: [] }),
        ],
      }],
    });
  }

  // "INFORME DE GESTION ITMSIF - Nombre Apellido - No. 3 Septiembre 2026.docx"
  // mes: número 1–12 (no el nombre). Acepta `sigla` o `siglaArchivo` (nombre en parametros/app).
  const nombreArchivoInforme = ({ sigla, siglaArchivo, nombreCorto, numeroInforme, mes, anio }) => {
    const m = Number(mes);
    if (!Number.isInteger(m) || m < 1 || m > 12) throw new Error(`Mes inválido para el nombre del archivo: ${mes}`);
    const s = sigla || siglaArchivo || 'ITMSIF';
    return `INFORME DE GESTION ${s} - ${nombreCorto} - No. ${numeroInforme} ${capitalizar(MESES[m - 1])} ${anio}.docx`
      .replace(/[\\/:*?"<>|]/g, '');
  };

  // Piezas reutilizables para otras descargas (cuenta de cobro, genérica) con
  // el mismo encabezado, pie y estilos, sin duplicar medidas.
  const encabezadoPie = (imagenes = {}, D = raiz.docx, formato = {}) =>
    crearEncabezadoPie(D, { ...FORMATO_DEFAULT, ...formato }, imagenes);
  const bloques = (D = raiz.docx, formato = {}) => crearBloques(D, { ...FORMATO_DEFAULT, ...formato });

  const api = { construirInformeDocx, nombreArchivoInforme, fechaLarga, textoPeriodo,
    encabezadoPie, bloques, FORMATO_DEFAULT };
  raiz.InformeDocx = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script data-modulo="descargas">
'use strict';
/* ============================================================================
   7) descargas.js — Word, Excel y vista previa (window.Descargas)
   Estructura:
     1. Imágenes del formato (encabezado, pie, firma del contratista)
     2. Opciones, valores legibles y «foto» del envío
     3. Informe mensual: datosDescarga (§9.3) + generación con InformeDocx
     4. Cuenta de cobro — FORMATO PROVISIONAL (aislado para reemplazarlo)
     5. Descarga genérica (una tabla por capítulo)
     6. Totales del envío (para reportes) y despachador por plantilla

(function (raiz) {
  const U = raiz.U;
  const Formulas = raiz.Formulas;

  /* ===== 1. Imágenes ===== */
  let cacheImagenes = null;
  const imagenesBase = () => {
    if (!cacheImagenes) {

        encabezado: U.uint8DeBase64(raiz.IMAGENES_B64.encabezado), tipoEncabezado: 'jpg',

    if (pregunta.origenOpciones) {
      const id = String(pregunta.origenOpciones).replace(/^catalogos\//, '');

            subs.forEach((s) => {
              const ocultaS = !visible(s, obtenerFila);

              celdas[s.id] = valorLegible(s, v, catalogos);

          return { ...base, columnas: subs.map((s) => ({ id: s.id, etiqueta: s.etiqueta, tipo: s.tipo, visibleEnDescarga: s.visibleEnDescarga !== false })), filas, valorLegible: `${filas.length} ${U.plural(filas.length, 'fila', 'filas')}` };

  const recolectarAnexos = (formulario, respuestas) => {

  /* ===== 3. Informe mensual ===== */
  const info = (contrato, cap, campo) => { const v = contrato && contrato.info && contrato.info[cap] && contrato.info[cap][campo]; return v == null ? '' : v; };
  const preguntaInfo = (catalogos, origen) => ({ origenOpciones: origen });
  // Correspondencia exacta de §9.3. Lo arma el cliente al enviar; el revisor lo regenera y compara.

    const R = respuestas || {};
    const rutaNas = info(contrato, 'contratista', 'rutaNas') || String((parametros && parametros.rutaNasPlantilla) || '').replace('<CEDULA>', (usuario && usuario.cedula) || '');

      numeroInforme: Number(R.numeroInforme) || 0,
      fechaElaboracion: R.fechaElaboracion || U.hoyISO(),
      periodo: { desde: R.periodoDesde || '', hasta: R.periodoHasta || '' },
      contratista: { nombreCompleto: (usuario && usuario.nombreCompleto) || info(contrato, 'contratista', 'nombreCompleto'), rol: info(contrato, 'contratista', 'rolProceso') },
      contrato: {
        numero: info(contrato, 'contrato', 'numero') || (contrato && contrato.numero) || '',

        componente: etiquetaOpcion(preguntaInfo(catalogos, 'catalogos/componentes'), info(contrato, 'contrato', 'componente'), catalogos),

        validador: info(contrato, 'supervision', 'validador'),

        obligacion: a.obligacion || '',
        porcentaje: Number(a.porcentaje) || 0,

  /* ===== 4. Cuenta de cobro — FORMATO PROVISIONAL ===== */

  const armarDatosCuentaCobro = ({ respuestas, formulario, contrato, usuario, parametros, catalogos }) => {

  /* ===== 5. Descarga genérica ===== */
  const generarGenerica = async ({ foto, titulo, subtitulo, firma, nombreArchivo }) => {

    ];

      const preguntas = (cap.preguntas || []).filter((q) => q.visibleEnDescarga !== false);
      if (!preguntas.length) return;
      hijos.push(new Paragraph({ keepNext: true, spacing: { before: 200, after: 80 }, children: [B.run(cap.capitulo, { bold: true, size: F.tamEtiqueta })] }));
      const filas = [];
      preguntas.forEach((q) => {
        if (q.tipo === 'COMPUESTA') {
          const cols = (q.columnas || []).filter((c) => c.visibleEnDescarga !== false);
          filas.push(filaDoble(q.etiqueta, q.valorLegible, false));
          if (cols.length && (q.filas || []).length) {

            const n = cols.length, anchoCol = Math.floor(ANCHO / n);
            const anchos = cols.map((_, i) => (i === n - 1 ? ANCHO - anchoCol * (n - 1) : anchoCol));
            const filasComp = [new TableRow({ tableHeader: true, children: cols.map((c, i) => B.celda([new Paragraph({ children: [B.run(c.etiqueta, { bold: true, size: 19 })] })], { width: anchos[i], blanco: true })) })];

      title: titulo,
      styles: { default: { document: { run: { font: F.fuente, size: F.tamValor }, paragraph: { spacing: { before: 0, after: 0, line: 240, lineRule: D.LineRuleType.AUTO } } } } },

  /* ===== 6. Totales y despachador ===== */
  const armarTotales = (formulario, respuestas, { parametros } = {}) => {
    const ev = Formulas.crearEvaluador({ formulario, respuestas, parametros });
    const R = respuestas || {};
    if (formulario.tipo === 'CUENTA_COBRO') {
      const n = (Array.isArray(R.planillas) ? R.planillas : []).length;
      const sumar = (campo) => U.redondear(Array.from({ length: n }).reduce((s, _, i) => s + (Number(ev.valorFila('planillas', i, campo)) || 0), 0), 0);
      return { valorCobrado: Number(R.valorCobrar) || 0, ibc: sumar('ibc'), salud: sumar('salud'), pension: sumar('pension'), arl: sumar('arl'),
        totalObligatorio: U.redondear(ev.valor('totalObligatorio'), 0), totalRealizado: U.redondear(ev.valor('totalRealizado'), 0), saldo: U.redondear(ev.valor('saldo'), 0) };
    }

      const acts = Array.isArray(R.actividades) ? R.actividades : [];
      const prom = acts.length ? acts.reduce((s, a) => s + (Number(a.porcentaje) || 0), 0) / acts.length : 0;
      return { actividades: acts.length, promedioEjecucion: U.redondear(prom, 1), anexos: (Array.isArray(R.anexos) ? R.anexos : []).length };

  };

    if (formulario.plantillaDescarga === 'informe_itm_sif') return armarDatosInforme({ respuestas, contrato, usuario, catalogos, parametros, voBoTexto });

      foto: envio.foto, firma,
      titulo: formulario.nombre,
      subtitulo: `${(contrato && contrato.numero) || envio.contratoId} · ${U.nombrePeriodo(envio.periodo)} · ${estado}${envio.consecutivo ? ` · No. ${envio.consecutivo}` : ''}`,
      nombreArchivo: `${formulario.nombre} - ${(usuario && usuario.nombreCorto) || ''} - ${U.nombrePeriodo(envio.periodo)}.docx`,
    });
  };

  /* ===== 7. Vista previa y PDF ===== */
  const vistaPrevia = async (blob, contenedor) => {
    const DP = raiz.docxPreview;

    contenedor.innerHTML = '';

  };

    const pdf = await raiz.Flujos.docxAPdf({ nombre, blob });

  };

  /* ===== 8. Excel ===== */
  // hojas: [{ nombre, columnas: [{ titulo, clave, ancho, formato: 'cop'|'fecha'|'numero'|'porcentaje' }], filas: [objeto] }]
  const exportarExcel = ({ hojas, nombreArchivo }) => {
    const X = raiz.XLSX;
    const nombre = U.sanearNombreArchivo(nombreArchivo || 'exportacion.xlsx');
    if (!X || !X.utils) {
      // Plan B: CSV de la primera hoja.
      const h = hojas[0];
      const esc = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
      const lineas = [h.columnas.map((c) => esc(c.titulo)).join(';')];
      h.filas.forEach((f) => lineas.push(h.columnas.map((c) => esc(c.formato === 'fecha' ? U.fechaCorta(f[c.clave]) : f[c.clave])).join(';')));
      U.descargarTexto(lineas.join('\n'), nombre.replace(/\.xlsx$/i, '.csv'), 'text/csv;charset=utf-8');
      return 'csv';
    }
    const libro = X.utils.book_new();
    const borde = { style: 'thin', color: { rgb: 'CFC7B8' } };
    hojas.forEach((h) => {
      const aoa = [h.columnas.map((c) => c.titulo)];
      h.filas.forEach((f) => aoa.push(h.columnas.map((c) => {
        const v = f[c.clave];
        if (c.formato === 'fecha') return U.esFecha(v) ? U.fechaHora(v) : (U.esISO(v) ? U.fechaCorta(v) : (v == null ? '' : v));
        if (c.formato === 'cop' || c.formato === 'numero' || c.formato === 'porcentaje') return v == null || v === '' ? '' : Number(v);
        return v == null ? '' : (Array.isArray(v) ? v.join(', ') : v);
      })));
      const hoja = X.utils.aoa_to_sheet(aoa);
      hoja['!cols'] = h.columnas.map((c) => ({ wch: c.ancho || 18 }));
      hoja['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(aoa.length - 1, 1), c: h.columnas.length - 1 } }) };
      h.columnas.forEach((c, j) => {
        const cab = hoja[X.utils.encode_cell({ r: 0, c: j })];
        if (cab) cab.s = { font: { bold: true, color: { rgb: 'FFFFFF' }, name: 'Arial', sz: 10 }, fill: { patternType: 'solid', fgColor: { rgb: '0E5E6F' } }, alignment: { vertical: 'center', horizontal: 'center', wrapText: true }, border: { top: borde, bottom: borde, left: borde, right: borde } };
        for (let r = 1; r < aoa.length; r++) {
          const celda = hoja[X.utils.encode_cell({ r, c: j })];
          if (!celda) continue;
          celda.s = { font: { name: 'Arial', sz: 10 }, border: { top: borde, bottom: borde, left: borde, right: borde }, alignment: { vertical: 'top', wrapText: c.ajustar !== false && !c.formato } };
          if (c.formato === 'cop') { celda.t = 'n'; celda.z = '"$"#,##0'; }
          if (c.formato === 'numero') { celda.t = 'n'; celda.z = '#,##0.##'; }
          if (c.formato === 'porcentaje') { celda.t = 'n'; celda.z = '0.0" %"'; }
        }
      });
      hoja['!rows'] = [{ hpt: 28 }];
      X.utils.book_append_sheet(libro, hoja, String(h.nombre || 'Hoja').slice(0, 31).replace(/[\\/?*[\]:]/g, ' '));
    });
    X.writeFile(libro, nombre);
    return 'xlsx';
  };
  // Lectura de un Excel (importador): devuelve filas como objetos por nombre de columna.
  const leerExcel = async (archivo) => {
    const X = raiz.XLSX;
    if (!X || !X.read) throw new Error('No cargó la librería de Excel; intenta de nuevo con conexión');

    armarDatosInforme, nombreInforme, generarInforme, armarDatosCuentaCobro, generarCuentaCobro, generarGenerica,
    armarTotales, armarDatosDescarga, generarDocx, vistaPrevia, descargarPDF, exportarExcel, leerExcel };
})(window);
</script>

    {accion ? <div className="mt-4 flex justify-center">{accion}</div> : null}
  </div>
);
const Alerta = ({ tipo = 'info', icono, children, className = '' }) => (
  <div className={`alerta-caja alerta-${tipo} ${className}`} role={tipo === 'error' ? 'alert' : 'status'}>
    <Icono nombre={icono || (tipo === 'exito' ? 'check' : tipo === 'error' || tipo === 'alerta' ? 'alerta' : 'info')} />
    <div className="flex-1 min-w-0">{children}</div>
  </div>
);

/* ===== 4. Campos ===== */
const Campo = ({ etiqueta, ayuda, error, obligatoria, id, children, className = '' }) => (
  <div className={`min-w-0 ${className}`}>
    {etiqueta ? <label className="etiqueta" htmlFor={id}>{etiqueta}{obligatoria ? <span className="req" aria-hidden="true">*</span> : null}</label> : null}
    {children}
    {error ? <div className="error-campo" role="alert"><Icono nombre="alerta" tam={14} />{error}</div> : (ayuda ? <div className="ayuda">{ayuda}</div> : null)}
  </div>
);
const Entrada = ({ invalido, className = '', ...props }) => <input className={`campo ${invalido ? 'invalido' : ''} ${className}`} {...props} />;
const Area = ({ invalido, className = '', autoAlto = true, ...props }) => {
  const ref = useRef(null);
  useEffect(() => { if (autoAlto && ref.current) { ref.current.style.height = 'auto'; ref.current.style.height = `${Math.min(ref.current.scrollHeight + 2, 600)}px`; } }, [props.value, autoAlto]);
  return <textarea ref={ref} className={`campo ${invalido ? 'invalido' : ''} ${className}`} {...props} />;
};
const Selector = ({ opciones, vacio = '— Seleccionar —', invalido, className = '', ...props }) => (
  <select className={`campo ${invalido ? 'invalido' : ''} ${className}`} {...props}>
    {vacio !== null ? <option value="">{vacio}</option> : null}
    {opciones.map((o) => <option key={String(o.valor)} value={o.valor}>{o.etiqueta}</option>)}
  </select>
);
const Conmutador = ({ activo, onCambio, etiqueta, id }) => (
  <div className="flex items-center gap-3">
    <button type="button" id={id} className="conmutador" role="switch" aria-checked={activo ? 'true' : 'false'} aria-label={etiqueta} onClick={() => onCambio(!activo)} />
    {etiqueta ? <label htmlFor={id} className="text-sm">{etiqueta}</label> : null}
  </div>
);
// Entrada de moneda: muestra separadores es-CO mientras se escribe; entrega número.
const EntradaMoneda = ({ valor, onCambio, invalido, ...props }) => {
  const [texto, setTexto] = useState(valor == null || valor === '' ? '' : U.formatoNumero(valor));
  useEffect(() => { const actual = U.parseNumero(texto); if ((valor == null || valor === '') && texto !== '') setTexto(''); else if (valor != null && valor !== '' && actual !== Number(valor)) setTexto(U.formatoNumero(valor)); }, [valor]); // eslint-disable-line
  return (
    <div className="relative">
      <span className="absolute left-3 top-1/2 -translate-y-1/2 texto-3 text-sm" aria-hidden="true">$</span>
      <Entrada inputMode="numeric" className="mono campo-moneda" invalido={invalido} value={texto}
        onChange={(e) => { const t = e.target.value.replace(/[^\d.,-]/g, ''); const n = U.parseNumero(t.replace(/\./g, '')); setTexto(n == null ? t : U.formatoNumero(n)); onCambio(n); }}
        onBlur={() => { const n = U.parseNumero(texto); setTexto(n == null ? '' : U.formatoNumero(n)); }} {...props} />
    </div>
  );
};
// Combobox con búsqueda; en móvil se abre como hoja inferior.
const Combobox = ({ opciones, valor, onCambio, placeholder = 'Buscar…', etiquetaDe = (o) => o.etiqueta, detalleDe, id, invalido, disabled, hojaMovil = true, permitirVacio = true, className = '' }) => {
  const [abierto, setAbierto] = useState(false);
  const [texto, setTexto] = useState('');
  const [resaltada, setResaltada] = useState(0);
  const ref = useRef(null);
  const movil = useMedia('(max-width: 640px)');
  useClicFuera(ref, () => setAbierto(false), abierto && !(movil && hojaMovil));
  const seleccionada = opciones.find((o) => String(o.valor) === String(valor));
  const filtradas = useMemo(() => {
    const t = U.sinTildes(texto).toLowerCase().trim();
    if (!t) return opciones;
    return opciones.filter((o) => U.sinTildes(`${etiquetaDe(o)} ${detalleDe ? detalleDe(o) : ''} ${o.grupo || ''}`).toLowerCase().includes(t));
  }, [opciones, texto, etiquetaDe, detalleDe]);
  const elegir = (o) => { onCambio(o ? o.valor : ''); setAbierto(false); setTexto(''); };
  const teclado = (e) => {
    if (!abierto && (e.key === 'ArrowDown' || e.key === 'Enter')) { setAbierto(true); e.preventDefault(); return; }
    if (e.key === 'ArrowDown') { setResaltada((r) => Math.min(r + 1, filtradas.length - 1)); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { setResaltada((r) => Math.max(r - 1, 0)); e.preventDefault(); }
    else if (e.key === 'Enter') { if (filtradas[resaltada]) elegir(filtradas[resaltada]); e.preventDefault(); }
    else if (e.key === 'Escape') setAbierto(false);
  };
  const lista = (
    <div className={`combo-lista ${movil && hojaMovil ? 'hoja-movil' : ''}`} role="listbox" id={id ? `${id}-lista` : undefined}>
      {movil && hojaMovil ? <div className="flex gap-2 mb-2"><Entrada autoFocus placeholder={placeholder} value={texto} onChange={(e) => { setTexto(e.target.value); setResaltada(0); }} onKeyDown={teclado} /><Boton soloIcono icono="x" titulo="Cerrar" onClick={() => setAbierto(false)} /></div> : null}
      {permitirVacio ? <button type="button" className="combo-opcion texto-3" onClick={() => elegir(null)}>— Ninguno —</button> : null}
      {filtradas.length === 0 ? <div className="texto-3 text-sm p-3">Sin coincidencias</div> : filtradas.slice(0, 200).map((o, i) => (
        <button type="button" key={String(o.valor)} role="option" aria-selected={String(o.valor) === String(valor)} className={`combo-opcion ${i === resaltada ? 'resaltada' : ''} ${String(o.valor) === String(valor) ? 'seleccionada' : ''}`} onMouseEnter={() => setResaltada(i)} onClick={() => elegir(o)}>
          <span>{etiquetaDe(o)}</span>
          {detalleDe && detalleDe(o) ? <small>{detalleDe(o)}</small> : (o.grupo ? <small>{o.grupo}</small> : null)}
        </button>
      ))}
    </div>
  );
  return (
    <div className={`combo ${className}`} ref={ref}>
      {abierto && movil && hojaMovil ? <div className="combo-fondo" onClick={() => setAbierto(false)} /> : null}
      <div className="relative">
        <Entrada id={id} role="combobox" aria-expanded={abierto} aria-controls={id ? `${id}-lista` : undefined} aria-autocomplete="list" invalido={invalido} disabled={disabled} placeholder={placeholder}
          value={abierto && !(movil && hojaMovil) ? texto : (seleccionada ? etiquetaDe(seleccionada) : '')}
          onFocus={() => { if (!disabled) setAbierto(true); }} onClick={() => { if (!disabled) setAbierto(true); }}
          onChange={(e) => { setTexto(e.target.value); setResaltada(0); if (!abierto) setAbierto(true); }} onKeyDown={teclado} readOnly={movil && hojaMovil} />
        <Icono nombre="abajo" className="absolute right-3 top-1/2 -translate-y-1/2 texto-3 pointer-events-none" tam={16} />
      </div>
      {abierto ? lista : null}
    </div>
  );
};
const Segmentado = ({ opciones, valor, onCambio, etiqueta }) => (
  <div className="segmentado" role="group" aria-label={etiqueta}>
    {opciones.map((o) => <button type="button" key={String(o.valor)} className={String(o.valor) === String(valor) ? 'activo' : ''} aria-pressed={String(o.valor) === String(valor)} onClick={() => onCambio(o.valor)}>{o.etiqueta}</button>)}
  </div>
);

/* ===== 5. Modales, confirmación, toasts ===== */
const Modal = ({ titulo, onCerrar, children, pie, ancho, descripcion }) => {
  const ref = useRef(null);
  useEffect(() => {
    const anterior = document.activeElement;
    const primero = ref.current && ref.current.querySelector('input, select, textarea, button:not(.btn-cerrar)');
    if (primero) primero.focus(); else if (ref.current) ref.current.focus();
    const tecla = (e) => { if (e.key === 'Escape') onCerrar && onCerrar(); };
    document.addEventListener('keydown', tecla);
    const desb = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', tecla); document.body.style.overflow = desb; if (anterior && anterior.focus) anterior.focus(); };
  }, []); // eslint-disable-line
  // No se cierra al soltar sobre el fondo tras seleccionar texto: solo con clic que empieza y termina en el fondo.
  const inicio = useRef(false);
  return (
    <div className="capa" onMouseDown={(e) => { inicio.current = e.target === e.currentTarget; }} onMouseUp={(e) => { if (inicio.current && e.target === e.currentTarget) onCerrar && onCerrar(); inicio.current = false; }}>
      <div className={`modal ${ancho === 'ancho' ? 'modal-ancho' : ''} ${ancho === 'xl' ? 'modal-xl' : ''}`} role="dialog" aria-modal="true" aria-label={titulo} tabIndex={-1} ref={ref}>
        <div className="modal-cabecera">
          <div className="min-w-0"><h2 className="truncate">{titulo}</h2>{descripcion ? <p className="text-xs texto-2">{descripcion}</p> : null}</div>
          {onCerrar ? <Boton variante="fantasma" soloIcono icono="x" titulo="Cerrar" className="btn-cerrar" tam="sm" onClick={onCerrar} /> : null}
        </div>
        <div className="modal-cuerpo">{children}</div>
        {pie ? <div className="modal-pie">{pie}</div> : null}
      </div>
    </div>
  );
};
const Toasts = ({ lista, onCerrar }) => (
  <div className="toasts" aria-live="polite" aria-relevant="additions">
    {lista.map((t) => (
      <div key={t.id} className={`toast toast-${t.tipo}`} role={t.tipo === 'error' ? 'alert' : 'status'}>
        <Icono nombre={t.tipo === 'exito' ? 'check' : t.tipo === 'error' ? 'alerta' : t.tipo === 'alerta' ? 'advertencia' : 'info'} />
        <div className="flex-1 min-w-0 whitespace-pre-wrap">{t.mensaje}</div>
        <button type="button" className="btn btn-fantasma btn-xs btn-icono" aria-label="Cerrar aviso" onClick={() => onCerrar(t.id)}><Icono nombre="x" tam={14} /></button>
      </div>
    ))}
  </div>
);
const MenuFlotante = ({ abierto, onCerrar, children }) => {
  const ref = useRef(null);
  useClicFuera(ref, onCerrar, abierto);
  if (!abierto) return null;
  return <div className="menu-flotante" ref={ref} role="menu">{children}</div>;
};

/* ===== 6. Tablas, listas, línea de tiempo, pestañas ===== */
// columnas: [{ titulo, clave?, render?(fila), ancho?, clase?, mono?, oculta? }]
const Tabla = ({ columnas, filas, claveFila = (f) => f.id, vacio, cargando, acciones }) => {
  if (cargando) return <div className="p-4"><Esqueleto filas={4} alto={18} /></div>;

          {filas.map((f) => (
            <tr key={claveFila(f)}>
              {cols.map((c) => <td key={c.titulo} data-etiqueta={c.titulo} className={`${c.clase || ''} ${c.mono ? 'mono' : ''}`}>{c.render ? c.render(f) : U.valorLegible(f[c.clave])}</td>)}

            </tr>
          ))}

};
const ListaDatos = ({ items }) => (
  <dl className="lista-datos">
    {items.filter((i) => i).map((i, k) => <div key={k}><dt>{i.etiqueta}</dt><dd className={i.mono ? 'mono' : ''}>{i.valor === '' || i.valor == null ? <span className="texto-3">—</span> : i.valor}</dd></div>)}
  </dl>
);
const PUNTO_ESTADO = { enviado: 'primario', reenviado: 'primario', en_revision: 'primario', aprobado_revisor: 'exito', aprobado: 'exito', en_correccion: 'alerta', rechazada: 'error', pendiente: 'alerta', aprobada: 'exito', finalizada: 'exito' };
const LineaTiempo = ({ entradas }) => (
  <ol className="linea-tiempo">
    {entradas.map((h, i) => (
      <li key={i}>
        <span className={`punto ${PUNTO_ESTADO[h.estado] || ''}`}><Icono nombre={h.icono || (h.estado === 'en_correccion' ? 'editar' : h.estado && h.estado.startsWith('aprobado') ? 'check' : 'enviar')} /></span>
        <div className="flex flex-wrap items-center gap-x-2 gap-y-0.5">
          <strong className="text-sm">{h.titulo || (U.ESTADOS[h.estado] || U.ESTADOS_SOLICITUD[h.estado] || { etiqueta: h.estado }).etiqueta}</strong>
          {h.fecha ? <span className="mono text-xs texto-3">{U.fechaHora(h.fecha)}</span> : null}

        <div className="text-sm texto-2">{h.porNombre || ''}{h.rol ? ` · ${U.ROLES[h.rol] || h.rol}` : ''}</div>
        {h.observacion ? <div className="text-sm mt-1 whitespace-pre-wrap">{h.observacion}</div> : null}
        {h.extra ? <div className="mt-1">{h.extra}</div> : null}
      </li>

);
const Pestanas = ({ lista, activa, onCambio }) => (
  <div className="pestanas" role="tablist">
    {lista.map((p) => <button type="button" key={p.id} role="tab" aria-selected={activa === p.id} className={activa === p.id ? 'activa' : ''} onClick={() => onCambio(p.id)}>{p.icono ? <Icono nombre={p.icono} tam={16} /> : null}{p.etiqueta}{p.contador ? <Insignia n={p.contador} /> : null}</button>)}
  </div>
);
const Indicador = ({ titulo, valor, pie, tipo }) => (
  <div className="indicador">
    <div className="titulo">{titulo}</div>
    <div className="valor" style={tipo ? { color: `var(--${tipo})` } : undefined}>{valor}</div>
    {pie ? <div className="text-xs texto-3 mt-1">{pie}</div> : null}

);
const Encabezado = ({ titulo, subtitulo, acciones, migas }) => (
  <div className="flex flex-wrap items-start justify-between gap-3 mb-4">
    <div className="min-w-0">
      {migas ? <div className="text-xs texto-3 mb-1 flex gap-1 flex-wrap">{migas.map((m, i) => <span key={i}>{i ? <span className="mx-1">/</span> : null}{m.onClick ? <button type="button" className="underline" onClick={m.onClick}>{m.texto}</button> : m.texto}</span>)}</div> : null}
      <h1>{titulo}</h1>
      {subtitulo ? <p className="texto-2 text-sm mt-0.5">{subtitulo}</p> : null}
    </div>
    {acciones ? <div className="flex gap-2 flex-wrap">{acciones}</div> : null}

);
const VolverArriba = () => {
  const [ver, setVer] = useState(false);
  useEffect(() => { const f = () => setVer(window.scrollY > 600); window.addEventListener('scroll', f, { passive: true }); return () => window.removeEventListener('scroll', f); }, []);
  if (!ver) return null;
  return <button type="button" className="volver-arriba" aria-label="Volver arriba" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}><Icono nombre="arriba" /></button>;
};

/* ===== 7. Vista previa de Word ===== */
// generar(): Promise<{ blob, nombre }>. Si la vista previa falla, ofrece la descarga.
const VistaPreviaDocx = ({ titulo, generar, onCerrar }) => {
  const app = useApp();
  const ref = useRef(null);
  const [estado, setEstado] = useState({ cargando: true, error: null, archivo: null });
  const [pdf, setPdf] = useState(false);
  useEffect(() => {
    let vivo = true;
    (async () => {
      try {
        const archivo = await generar();
        if (!vivo) return;
        setEstado({ cargando: false, error: null, archivo });
        await Descargas.vistaPrevia(archivo.blob, ref.current);
      } catch (e) { console.error(e); if (vivo) setEstado((s) => ({ ...s, cargando: false, error: e.message || String(e) })); }
    })();
    return () => { vivo = false; };
  }, []); // eslint-disable-line
  const descargar = () => { if (estado.archivo) U.descargarBlob(estado.archivo.blob, estado.archivo.nombre); };
  const aPdf = async () => {
    setPdf(true);
    try { await Descargas.descargarPDF(estado.archivo); } catch (e) { app.avisar('error', `No se pudo generar el PDF: ${e.message}`); } finally { setPdf(false); }
  };
  return (
    <Modal titulo={titulo || 'Vista previa'} ancho="xl" onCerrar={onCerrar} descripcion={estado.archivo ? estado.archivo.nombre : ''} pie={<>
      <Boton onClick={onCerrar}>Cerrar</Boton>
      {Flujos.disponible('docxAPdf') && estado.archivo ? <Boton icono="pdf" cargando={pdf} onClick={aPdf}>PDF</Boton> : null}
      <Boton variante="primario" icono="word" disabled={!estado.archivo} onClick={descargar}>Descargar Word</Boton>
    </>}>
      {estado.cargando ? <Cargando texto="Generando el documento…" /> : null}
      {estado.error ? <Alerta tipo="alerta">No se pudo mostrar la vista previa ({estado.error}). {estado.archivo ? 'Puedes descargar el Word.' : ''}</Alerta> : null}
      <div className="docx-vista mt-2" ref={ref} style={{ display: estado.cargando || estado.error ? 'none' : 'block' }} />
    </Modal>
  );
};
</script>
<script type="text/babel" data-presets="react" data-modulo="81-auth">
/* ============================================================================
   9) auth.jsx — acceso: inicio de sesión, activación de cuenta, verificación de
      correo, recuperación de contraseña y cierre de la activación (perfil + contratos)
   Estructura:
     1. Marco visual de las pantallas de acceso
     2. Inicio de sesión (+ usuarios de demostración)
     3. Activación (crear cuenta con el correo precargado)
     4. Recuperación de contraseña
     5. Verificación de correo
     6. Completar activación: preRegistro → usuarios/{uid} → reclamar contratos
   ============================================================================ */

/* ===== 1. Marco ===== */
const MarcoAcceso = ({ children, titulo, subtitulo }) => {
  const app = useApp();
  return (
    <div className="min-h-[100dvh] flex flex-col" style={{ background: 'var(--fondo)' }}>
      {MODO_DEMO ? <div className="banner-demo"><strong>Modo demostración</strong> · datos ficticios guardados solo en este navegador · {MOTIVO_DEMO === 'sin-config' ? 'configura firebaseConfig para conectar el proyecto real' : 'quita ?demo=1 (o abre ?demo=0) para usar Firebase'}</div> : null}
      <div className="flex-1 grid lg:grid-cols-[1.1fr_1fr]">
        <aside className="hidden lg:flex flex-col justify-between p-12" style={{ background: 'var(--primario)', color: '#F6F4EF' }}>
          <div className="marca" style={{ color: '#F6F4EF' }}><span className="marca-logo" style={{ background: '#F6F4EF', color: 'var(--primario)' }}><Icono nombre="contrato" tam={20} /></span>{app.parametros.nombreApp}</div>
          <div className="max-w-md">
            <p className="text-xs uppercase tracking-[0.2em] opacity-80 mb-3">{app.parametros.nombreDependencia}</p>
            <h1 className="text-3xl font-semibold leading-tight mb-4" style={{ color: '#F6F4EF' }}>Informes de ejecución y cuentas de cobro, en un solo lugar.</h1>
            <p className="opacity-85 text-sm leading-relaxed">Diligencia el informe mensual y la cuenta de cobro dentro de la ventana del período, descarga el Word en el formato institucional y sigue las correcciones desde Solicitudes.</p>
          </div>
          <p className="text-xs opacity-70">v{VERSION_APP} · {app.parametros.nombreEntidad}</p>
        </aside>
        <main className="flex items-center justify-center p-4 sm:p-8">
          <div className="w-full max-w-md entrar">
            <div className="marca mb-6 lg:hidden"><span className="marca-logo"><Icono nombre="contrato" tam={20} /></span>{app.parametros.nombreApp}</div>
            <div className="tarjeta">
              <div className="tarjeta-cuerpo">
                <h1 className="mb-1">{titulo}</h1>
                {subtitulo ? <p className="texto-2 text-sm mb-5">{subtitulo}</p> : <div className="mb-4" />}
                {children}
              </div>
            </div>
            <div className="flex justify-between items-center mt-4 text-xs texto-3">
              <span>Zona horaria: America/Bogota</span>
              <button type="button" className="underline" onClick={app.alternarTema}>Tema {app.tema === 'oscuro' ? 'claro' : 'oscuro'}</button>
            </div>
          </div>
        </main>
      </div>
    </div>

};

/* ===== 2. Inicio de sesión ===== */
const PantallaAcceso = () => {
  const [vista, setVista] = useState('login');
  if (vista === 'activar') return <PantallaActivar volver={() => setVista('login')} />;
  if (vista === 'recuperar') return <PantallaRecuperar volver={() => setVista('login')} />;
  return <PantallaLogin irA={setVista} />;
};
const PantallaLogin = ({ irA }) => {
  const app = useApp();
  const [correo, setCorreo] = useState('');
  const [clave, setClave] = useState('');
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState('');
  const entrar = async (e) => {
    e.preventDefault();
    setError('');
    if (!U.esCorreo(correo)) { setError('Escribe un correo válido.'); return; }
    if (!MODO_DEMO && !clave) { setError('Escribe tu contraseña.'); return; }
    setCargando(true);
    try { await Auth.iniciarSesion(correo, clave); } catch (err) { setError(Auth.traducirError(err)); } finally { setCargando(false); }
  };
  const demo = MODO_DEMO ? Auth.usuariosDemo() : [];
  return (
    <MarcoAcceso titulo="Iniciar sesión" subtitulo="Usa el correo con el que te registraron.">
      {demo.length ? (
        <div className="mb-5">
          <p className="etiqueta">Entrar como usuario de demostración</p>
          <div className="grid gap-2">
            {demo.map((u) => (
              <button type="button" key={u.uid} className="btn btn-secundario justify-between" onClick={async () => { try { await Auth.entrarDemo(u.uid); } catch (err) { setError(err.message); } }}>
                <span className="flex items-center gap-2"><Icono nombre="usuario" /> {u.nombres} {u.apellidos}</span>
                <Chip tipo={u.rol === 'admin' ? 'acento' : u.rol === 'contratista' ? 'primario' : 'info'}>{U.ROLES[u.rol]}</Chip>
              </button>
            ))}
          </div>
          <div className="flex items-center gap-3 my-4 text-xs texto-3"><span className="flex-1 border-t" style={{ borderColor: 'var(--borde)' }} />o con correo<span className="flex-1 border-t" style={{ borderColor: 'var(--borde)' }} /></div>
        </div>
      ) : null}
      <form onSubmit={entrar} className="grid gap-4" noValidate>
        <Campo etiqueta="Correo" id="login-correo"><Entrada id="login-correo" type="email" autoComplete="username" inputMode="email" value={correo} onChange={(e) => setCorreo(e.target.value)} required /></Campo>
        <Campo etiqueta="Contraseña" id="login-clave"><Entrada id="login-clave" type="password" autoComplete="current-password" value={clave} onChange={(e) => setClave(e.target.value)} required={!MODO_DEMO} /></Campo>
        {error ? <Alerta tipo="error">{error}</Alerta> : null}
        <Boton tipo="submit" variante="primario" cargando={cargando} icono="flecha">Entrar</Boton>
      </form>
      <div className="flex flex-col sm:flex-row gap-2 justify-between mt-5 text-sm">
        <button type="button" className="underline" onClick={() => irA('activar')}>Soy contratista nuevo: activar mi cuenta</button>
        <button type="button" className="underline texto-2" onClick={() => irA('recuperar')}>Olvidé mi contraseña</button>
      </div>
    </MarcoAcceso>
  );
};

/* ===== 3. Activación ===== */
const PantallaActivar = ({ volver }) => {
  const [f, setF] = useState({ cedula: '', correo: '', clave: '', clave2: '', nombres: '', apellidos: '', telefono: '' });
  const [cargando, setCargando] = useState(false);
  const [error, setError] = useState('');
  const poner = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const activar = async (e) => {
    e.preventDefault();
    setError('');
    const cedula = U.soloDigitos(f.cedula);
    if (cedula.length < 5) { setError('Escribe tu cédula (solo números).'); return; }
    if (!U.esCorreo(f.correo)) { setError('Escribe el correo que te precargó la entidad.'); return; }
    if (!f.nombres.trim() || !f.apellidos.trim()) { setError('Escribe tus nombres y apellidos.'); return; }
    if (f.clave.length < 6) { setError('La contraseña debe tener al menos 6 caracteres.'); return; }
    if (f.clave !== f.clave2) { setError('Las contraseñas no coinciden.'); return; }
    setCargando(true);
    try {
      // Se guarda antes de registrar: al volver del correo de verificación se retoma la activación.
      try { localStorage.setItem('bitacora.activacion', JSON.stringify({ cedula, nombres: f.nombres.trim(), apellidos: f.apellidos.trim(), telefono: f.telefono.trim() })); } catch (err) { /* sin localStorage */ }
      await Auth.registrar(f.correo, f.clave);
    } catch (err) { setError(Auth.traducirError(err)); } finally { setCargando(false); }
  };
  return (
    <MarcoAcceso titulo="Activar mi cuenta" subtitulo="Solo para contratistas precargados por la entidad. Usa el mismo correo que les diste.">
      <form onSubmit={activar} className="grid gap-4" noValidate>
        <div className="grid sm:grid-cols-2 gap-4">
          <Campo etiqueta="Cédula" id="act-cedula" obligatoria><Entrada id="act-cedula" inputMode="numeric" autoComplete="off" className="mono" value={f.cedula} onChange={poner('cedula')} /></Campo>
          <Campo etiqueta="Teléfono" id="act-tel"><Entrada id="act-tel" inputMode="tel" autoComplete="tel" value={f.telefono} onChange={poner('telefono')} /></Campo>
          <Campo etiqueta="Nombres" id="act-nombres" obligatoria><Entrada id="act-nombres" autoComplete="given-name" value={f.nombres} onChange={poner('nombres')} /></Campo>
          <Campo etiqueta="Apellidos" id="act-apellidos" obligatoria><Entrada id="act-apellidos" autoComplete="family-name" value={f.apellidos} onChange={poner('apellidos')} /></Campo>
        </div>
        <Campo etiqueta="Correo precargado" id="act-correo" obligatoria><Entrada id="act-correo" type="email" inputMode="email" autoComplete="username" value={f.correo} onChange={poner('correo')} /></Campo>
        <div className="grid sm:grid-cols-2 gap-4">
          <Campo etiqueta="Contraseña" id="act-clave" obligatoria ayuda="Mínimo 6 caracteres."><Entrada id="act-clave" type="password" autoComplete="new-password" value={f.clave} onChange={poner('clave')} /></Campo>
          <Campo etiqueta="Repetir contraseña" id="act-clave2" obligatoria><Entrada id="act-clave2" type="password" autoComplete="new-password" value={f.clave2} onChange={poner('clave2')} /></Campo>
        </div>
        {error ? <Alerta tipo="error">{error}</Alerta> : null}
        <Boton tipo="submit" variante="primario" cargando={cargando} icono="flecha">Crear cuenta y verificar correo</Boton>
        <button type="button" className="underline text-sm texto-2 justify-self-start" onClick={volver}>Volver a iniciar sesión</button>
      </form>
    </MarcoAcceso>
  );
};

/* ===== 4. Recuperación ===== */
const PantallaRecuperar = ({ volver }) => {
  const [correo, setCorreo] = useState('');
  const [estado, setEstado] = useState({ cargando: false, listo: false, error: '' });
  const enviar = async (e) => {
    e.preventDefault();
    if (!U.esCorreo(correo)) { setEstado({ cargando: false, listo: false, error: 'Escribe un correo válido.' }); return; }
    setEstado({ cargando: true, listo: false, error: '' });
    try { await Auth.recuperarClave(correo); setEstado({ cargando: false, listo: true, error: '' }); }
    catch (err) { setEstado({ cargando: false, listo: false, error: Auth.traducirError(err) }); }
  };
  return (
    <MarcoAcceso titulo="Recuperar contraseña" subtitulo="Te enviamos un enlace para definir una contraseña nueva.">
      {estado.listo ? <Alerta tipo="exito">Si el correo existe, recibirás el enlace en unos minutos. Revisa también la carpeta de no deseados.</Alerta> : (
        <form onSubmit={enviar} className="grid gap-4" noValidate>
          <Campo etiqueta="Correo" id="rec-correo"><Entrada id="rec-correo" type="email" inputMode="email" autoComplete="username" value={correo} onChange={(e) => setCorreo(e.target.value)} /></Campo>
          {estado.error ? <Alerta tipo="error">{estado.error}</Alerta> : null}
          <Boton tipo="submit" variante="primario" cargando={estado.cargando} icono="correo">Enviar enlace</Boton>
        </form>
      )}
      <button type="button" className="underline text-sm texto-2 mt-5" onClick={volver}>Volver a iniciar sesión</button>
    </MarcoAcceso>
  );
};

/* ===== 5. Verificación de correo ===== */
const PantallaVerificar = ({ sesion, alVerificar }) => {
  const app = useApp();
  const [cargando, setCargando] = useState(false);
  const [mensaje, setMensaje] = useState('');
  const reenviar = async () => { setCargando(true); try { await Auth.enviarVerificacion(); setMensaje('Correo reenviado.'); } catch (e) { setMensaje(Auth.traducirError(e)); } finally { setCargando(false); } };
  const comprobar = async () => {
    setCargando(true);
    try { const u = await Auth.recargar(); if (u && u.emailVerified) alVerificar(u); else setMensaje('Todavía no aparece verificado. Abre el enlace del correo y vuelve a intentar.'); }
    catch (e) { setMensaje(Auth.traducirError(e)); } finally { setCargando(false); }
  };
  return (
    <MarcoAcceso titulo="Verifica tu correo" subtitulo={`Enviamos un enlace a ${sesion.email}. Ábrelo y luego pulsa «Ya verifiqué».`}>
      <div className="grid gap-3">
        <Boton variante="primario" icono="check" cargando={cargando} onClick={comprobar}>Ya verifiqué</Boton>
        <Boton icono="correo" cargando={cargando} onClick={reenviar}>Reenviar correo</Boton>
        <Boton variante="fantasma" icono="salir" onClick={() => app.cerrarSesion()}>Cerrar sesión</Boton>
        {mensaje ? <Alerta tipo="info">{mensaje}</Alerta> : null}
      </div>
    </MarcoAcceso>
  );
};

/* ===== 6. Completar activación ===== */
// El correo ya está verificado pero no existe usuarios/{uid}: se lee preRegistro
// (la regla solo lo permite si el correo coincide), se crea el perfil y DESPUÉS
// se reclaman los contratos uno por uno.
const PantallaCompletarActivacion = ({ sesion, alTerminar }) => {
  const app = useApp();
  const guardado = useMemo(() => { try { return JSON.parse(localStorage.getItem('bitacora.activacion') || 'null') || {}; } catch (e) { return {}; } }, []);
  const [f, setF] = useState({ cedula: guardado.cedula || '', nombres: guardado.nombres || '', apellidos: guardado.apellidos || '', telefono: guardado.telefono || '' });
  const [estado, setEstado] = useState({ cargando: false, error: '', pasos: [] });
  const poner = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const paso = (t) => setEstado((s) => ({ ...s, pasos: [...s.pasos, t] }));
  const completar = async (e) => {
    e.preventDefault();
    const cedula = U.soloDigitos(f.cedula);
    if (cedula.length < 5 || !f.nombres.trim() || !f.apellidos.trim()) { setEstado({ cargando: false, error: 'Completa cédula, nombres y apellidos.', pasos: [] }); return; }
    setEstado({ cargando: true, error: '', pasos: [] });
    try {
      const pre = await DB.obtenerPreRegistro(cedula);
      if (!pre) throw new Error('Tu cédula no está precargada o el correo no coincide con el registrado por la entidad. Escribe al administrador.');
      if (U.normalizarCorreo(pre.correo) !== sesion.email) throw new Error('El correo de esta cuenta no coincide con el precargado para esa cédula.');
      if (pre.activado && pre.uid && pre.uid !== sesion.uid) throw new Error('Esa cédula ya fue activada con otra cuenta. Escribe al administrador.');
      paso('Precarga encontrada');
      const nombreCompleto = `${f.nombres.trim()} ${f.apellidos.trim()}`.replace(/\s+/g, ' ');
      await DB.crearPerfil(sesion.uid, {
        rol: 'contratista', nombres: f.nombres.trim(), apellidos: f.apellidos.trim(), nombreCompleto, nombreCorto: U.nombreCorto(f.nombres, f.apellidos),
        cedula, correo: sesion.email, telefono: f.telefono.trim(), activo: true, revisores: pre.revisores || [], coordinadores: pre.coordinadores || [],
      });
      paso('Perfil creado');
      let reclamados = 0;
      for (const id of (pre.contratos || [])) {
        try { await DB.reclamarContrato(id, sesion.uid); reclamados++; paso(`Contrato ${id} vinculado`); }
        catch (err) { console.warn('No se pudo reclamar', id, err); paso(`Contrato ${id}: ${DB.traducirError(err)}`); }
      }
      try { await DB.marcarActivado(cedula, sesion.uid); } catch (err) { console.warn('No se pudo marcar el preRegistro', err); }
      try { localStorage.removeItem('bitacora.activacion'); } catch (err) { /* nada */ }
      app.avisar('exito', `Cuenta activada${reclamados ? ` · ${reclamados} ${U.plural(reclamados, 'contrato vinculado', 'contratos vinculados')}` : ''}`);
      alTerminar();
    } catch (err) { setEstado((s) => ({ ...s, cargando: false, error: DB.traducirError(err) })); }
  };
  return (
    <MarcoAcceso titulo="Completar activación" subtitulo="Correo verificado. Confirma tu cédula para vincular tus contratos.">
      <form onSubmit={completar} className="grid gap-4" noValidate>
        <Campo etiqueta="Cédula" id="comp-cedula" obligatoria><Entrada id="comp-cedula" inputMode="numeric" className="mono" value={f.cedula} onChange={poner('cedula')} /></Campo>
        <div className="grid sm:grid-cols-2 gap-4">
          <Campo etiqueta="Nombres" id="comp-nombres" obligatoria><Entrada id="comp-nombres" value={f.nombres} onChange={poner('nombres')} /></Campo>
          <Campo etiqueta="Apellidos" id="comp-apellidos" obligatoria><Entrada id="comp-apellidos" value={f.apellidos} onChange={poner('apellidos')} /></Campo>
        </div>
        <Campo etiqueta="Teléfono" id="comp-tel"><Entrada id="comp-tel" inputMode="tel" value={f.telefono} onChange={poner('telefono')} /></Campo>
        {estado.pasos.length ? <ul className="text-sm texto-2 grid gap-1">{estado.pasos.map((p, i) => <li key={i} className="flex gap-2 items-center"><Icono nombre="check" tam={14} />{p}</li>)}</ul> : null}
        {estado.error ? <Alerta tipo="error">{estado.error}</Alerta> : null}
        <Boton tipo="submit" variante="primario" cargando={estado.cargando} icono="check">Vincular mis contratos</Boton>
        <Boton variante="fantasma" icono="salir" onClick={() => app.cerrarSesion()}>Cerrar sesión</Boton>
      </form>
    </MarcoAcceso>
  );
};
</script>
<script type="text/babel" data-presets="react" data-modulo="82-layout">
/* ============================================================================
   10) layout.jsx — estructura de la app: barra superior (selector global de
       contrato, período, chip de ventana, tema, usuario), barra lateral de
       escritorio, navegación inferior móvil y hoja «Más»
   Estructura:
     1. Menús por rol
     2. Selectores globales (contrato y período) y chip de ventana
     3. Barra superior y menú de usuario
     4. Barra lateral y navegación inferior
     5. Shell
   ============================================================================ */

/* ===== 1. Menús por rol ===== */
const NAV_POR_ROL = {
  contratista: [
    { id: 'inicio', etiqueta: 'Inicio', icono: 'inicio', ruta: '#/inicio' },
    { id: 'envios', etiqueta: 'Mis envíos', icono: 'envios', ruta: '#/envios' },
    { id: 'solicitudes', etiqueta: 'Solicitudes', icono: 'solicitudes', ruta: '#/solicitudes', contador: 'solicitudes' },
    { id: 'contrato', etiqueta: 'Contrato', icono: 'contrato', ruta: '#/contrato' },
  ],
  revisor: [
    { id: 'revision', etiqueta: 'Revisión', icono: 'revision', ruta: '#/revision', contador: 'revision' },
    { id: 'solicitudes', etiqueta: 'Solicitudes', icono: 'solicitudes', ruta: '#/solicitudes', contador: 'solicitudes' },
    { id: 'contratos', etiqueta: 'Contratos', icono: 'contrato', ruta: '#/contratos' },
    { id: 'reportes', etiqueta: 'Reportes', icono: 'reportes', ruta: '#/reportes' },
  ],
  admin: [
    { id: 'inicio', etiqueta: 'Inicio', icono: 'inicio', ruta: '#/admin' },
    { id: 'revision', etiqueta: 'Revisión', icono: 'revision', ruta: '#/revision', contador: 'revision' },
    { id: 'solicitudes', etiqueta: 'Solicitudes', icono: 'solicitudes', ruta: '#/solicitudes', contador: 'solicitudes' },
    { id: 'reportes', etiqueta: 'Reportes', icono: 'reportes', ruta: '#/reportes' },
    { seccion: 'Administración' },
    { id: 'admin-contratos', etiqueta: 'Contratistas y contratos', icono: 'contrato', ruta: '#/admin/contratos' },
    { id: 'admin-usuarios', etiqueta: 'Usuarios', icono: 'usuarios', ruta: '#/admin/usuarios' },
    { id: 'admin-ventanas', etiqueta: 'Ventanas', icono: 'ventana', ruta: '#/admin/ventanas' },
    { id: 'admin-formularios', etiqueta: 'Formularios', icono: 'formulario', ruta: '#/admin/formularios' },
    { id: 'admin-catalogos', etiqueta: 'Catálogos', icono: 'catalogo', ruta: '#/admin/catalogos' },
    { id: 'admin-parametros', etiqueta: 'Parámetros', icono: 'parametros', ruta: '#/admin/parametros' },
  ],
};
NAV_POR_ROL.coordinador = NAV_POR_ROL.revisor;
const navDe = (rol) => NAV_POR_ROL[rol] || NAV_POR_ROL.contratista;
const idActivo = (ruta) => {
  const r = ruta.hash || '';
  if (r.startsWith('#/admin/contratos')) return 'admin-contratos';
  if (r.startsWith('#/admin/usuarios')) return 'admin-usuarios';
  if (r.startsWith('#/admin/ventanas')) return 'admin-ventanas';
  if (r.startsWith('#/admin/formularios')) return 'admin-formularios';
  if (r.startsWith('#/admin/catalogos')) return 'admin-catalogos';
  if (r.startsWith('#/admin/parametros')) return 'admin-parametros';
  if (r.startsWith('#/admin')) return 'inicio';
  if (r.startsWith('#/inicio') || r === '#/' || r === '' || r === '#') return 'inicio';
  if (r.startsWith('#/envios')) return 'envios';
  if (r.startsWith('#/solicitudes')) return 'solicitudes';
  if (r.startsWith('#/contratos')) return 'contratos';
  if (r.startsWith('#/contrato')) return 'contrato';
  if (r.startsWith('#/revision')) return 'revision';
  if (r.startsWith('#/reportes')) return 'reportes';
  if (r.startsWith('#/formulario')) return 'inicio';
  return '';
};

/* ===== 2. Selectores globales ===== */
const SelectorContrato = () => {
  const app = useApp();
  const opciones = app.contratos.map((c) => ({ valor: c.id, etiqueta: `${c.numero || c.id}${c.etiqueta ? ` · ${c.etiqueta}` : ''}`, detalle: `${c.estado === 'terminado' ? 'Terminado' : 'Activo'}${c.info && c.info.contratista && c.info.contratista.nombreCompleto && app.rol !== 'contratista' ? ` · ${c.info.contratista.nombreCompleto}` : ''}` }));
  if (!opciones.length) return <span className="selector-global texto-3 text-xs"><Icono nombre="contrato" /> <span className="valor">Sin contratos</span></span>;
  return <div className="combo-contrato" style={{ width: 'min(46vw, 340px)' }}><Combobox id="sel-contrato" opciones={opciones} valor={app.contratoId} onCambio={(v) => app.elegirContrato(v)} placeholder="Buscar contrato…" detalleDe={(o) => o.detalle} permitirVacio={false} /></div>;
};
const SelectorPeriodo = () => {
  const app = useApp();
  const opciones = useMemo(() => {
    const actual = U.periodoActual();
    const lista = U.listaPeriodos(U.desplazarPeriodo(actual, -18), U.desplazarPeriodo(actual, 2)).reverse();
    if (app.periodo && !lista.includes(app.periodo)) lista.unshift(app.periodo);
    return lista.map((p) => ({ valor: p, etiqueta: U.nombrePeriodo(p) }));
  }, [app.periodo]);
  return <Selector aria-label="Período" className="selector-global" style={{ width: 'auto', minHeight: 38 }} vacio={null} opciones={opciones} value={app.periodo} onChange={(e) => app.elegirPeriodo(e.target.value)} />;
};
const ChipVentana = ({ enBanner }) => {
  const app = useApp();
  const ahora = useReloj(30000);
  const v = app.ventana;
  const e = U.estadoVentana(v, null, ahora);
  let texto, tipo, icono = 'reloj';
  if (e.estado === 'abierta') { texto = `Ventana abierta · cierra en ${U.cuentaRegresiva(e.faltan)}`; tipo = 'exito'; }
  else if (e.estado === 'por_abrir') { texto = `Ventana abre en ${U.cuentaRegresiva(e.faltan)}`; tipo = 'info'; icono = 'calendario'; }
  else if (e.estado === 'cerrada') { texto = `Ventana cerrada · ${U.fechaCorta(v.hasta)}`; tipo = 'alerta'; icono = 'candado'; }
  else { texto = `Sin ventana para ${U.nombrePeriodo(app.periodo)}`; tipo = 'neutro'; icono = 'candado'; }
  const estilo = { background: `var(--${tipo === 'neutro' ? 'superficie-2' : `${tipo}-suave`})`, color: `var(--${tipo === 'neutro' ? 'texto-2' : tipo})`, borderColor: `color-mix(in srgb, var(--${tipo === 'neutro' ? 'borde' : tipo}) 40%, transparent)` };
  return <span className={enBanner ? 'chip' : 'chip-ventana'} style={estilo} title={v ? U.textoVentana(v) : ''}><Icono nombre={icono} /> {texto}</span>;
};

/* ===== 3. Barra superior ===== */
const MenuUsuario = () => {
  const app = useApp();
  const [abierto, setAbierto] = useState(false);
  const u = app.usuario;
  return (
    <div className="relative">
      <button type="button" className="flex items-center gap-2 rounded-full p-1 pr-2" style={{ border: '1px solid var(--borde)' }} aria-haspopup="menu" aria-expanded={abierto} onClick={() => setAbierto(!abierto)} title={u.nombreCompleto}>
        <span className="w-8 h-8 rounded-full grid place-items-center text-xs font-bold" style={{ background: 'var(--primario)', color: 'var(--primario-texto)' }}>{U.iniciales(u.nombreCompleto)}</span>
        <span className="hidden md:inline text-sm font-medium max-w-[140px] truncate">{u.nombreCorto || u.nombreCompleto}</span>
        <Icono nombre="abajo" tam={14} className="texto-3 hidden md:inline" />
      </button>
      <MenuFlotante abierto={abierto} onCerrar={() => setAbierto(false)}>
        <div className="px-3 py-2 text-xs texto-2 border-b mb-1" style={{ borderColor: 'var(--borde)' }}><div className="font-semibold" style={{ color: 'var(--texto)' }}>{u.nombreCompleto}</div><div>{U.ROLES[app.rol]} · {u.correo}</div></div>
        <button type="button" role="menuitem" onClick={() => { setAbierto(false); app.navegar('#/perfil'); }}><Icono nombre="usuario" /> Mi perfil y firma</button>
        <button type="button" role="menuitem" onClick={() => { setAbierto(false); app.alternarTema(); }}><Icono nombre={app.tema === 'oscuro' ? 'sol' : 'luna'} /> Tema {app.tema === 'oscuro' ? 'claro' : 'oscuro'}</button>
        <button type="button" role="menuitem" onClick={() => { setAbierto(false); app.recargarTodo(); }}><Icono nombre="refrescar" /> Actualizar datos</button>
        {MODO_DEMO ? <button type="button" role="menuitem" onClick={async () => { setAbierto(false); if (await app.confirmar({ titulo: 'Reiniciar la demostración', mensaje: 'Se borran los datos de prueba de este navegador y se vuelven a crear.', textoOk: 'Reiniciar', peligro: true })) { await DB.reiniciarDemo(); window.location.reload(); } }}><Icono nombre="refrescar" /> Reiniciar datos demo</button> : null}
        <button type="button" role="menuitem" onClick={() => { setAbierto(false); app.cerrarSesion(); }}><Icono nombre="salir" /> Cerrar sesión</button>
      </MenuFlotante>
    </div>
  );
};
const BarraSuperior = () => {
  const app = useApp();
  const logo = app.parametros.marca && app.parametros.marca.logoUrl;
  return (
    <header className="barra-superior">
      <a href="#/inicio" className="marca" aria-label="Inicio" onClick={(e) => { e.preventDefault(); app.navegar(app.rol === 'admin' ? '#/admin' : app.rol === 'contratista' ? '#/inicio' : '#/revision'); }}>
        <span className="marca-logo">{logo ? <img src={logo} alt="" /> : <Icono nombre="contrato" tam={18} />}</span>
        <span className="hidden lg:inline">{app.parametros.nombreApp}</span>
      </a>
      <div className="barra-centro">
        <SelectorContrato />
        <SelectorPeriodo />
        <ChipVentana />
      </div>
      <div className="barra-derecha">
        <button type="button" className="btn btn-fantasma btn-icono btn-sm" aria-label="Cambiar tema" onClick={app.alternarTema}><Icono nombre={app.tema === 'oscuro' ? 'sol' : 'luna'} /></button>
        <MenuUsuario />
      </div>
    </header>
  );
};

/* ===== 4. Barra lateral y navegación inferior ===== */
const BarraLateral = () => {
  const app = useApp();
  const activo = idActivo(app.ruta);
  return (
    <nav className="nav-lateral" aria-label="Principal">
      {navDe(app.rol).map((n, i) => (n.seccion ? <div key={`s${i}`} className="nav-seccion">{n.seccion}</div> : (
        <button type="button" key={n.id} className={`nav-enlace ${activo === n.id ? 'activo' : ''}`} aria-current={activo === n.id ? 'page' : undefined} onClick={() => app.navegar(n.ruta)}>
          <Icono nombre={n.icono} /> <span className="flex-1">{n.etiqueta}</span>{n.contador ? <Insignia n={app.contadores[n.contador]} /> : null}
        </button>
      )))}
      <div className="mt-auto pt-4 text-xs texto-3 px-3">v{VERSION_APP} · {DB.modo === 'demo' ? 'demostración' : 'Firestore'}</div>
    </nav>
  );
};
