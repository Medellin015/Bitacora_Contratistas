<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E5E6F">
<title>Bitácora Contratistas</title>
<meta name="description" content="Plataforma de informes de ejecución y cuentas de cobro para contratistas (ITM · Secretaría de Infraestructura Física).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E5E6F'/%3E%3Cpath d='M9 8h11a3 3 0 0 1 3 3v13H12a3 3 0 0 1-3-3V8z' fill='none' stroke='%23F6F4EF' stroke-width='2'/%3E%3Cpath d='M13 13h6M13 17h6' stroke='%23D97706' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<!-- ========================================================================
     Librerías por CDN, cargadas EN ORDEN (ver PROMPT §4). Versiones fijas.
     1) React 18.3.1 UMD + Babel standalone (JSX en el navegador)
     2) Firebase compat 10.14.1 (app, auth, firestore)
     3) jszip → docx-preview → alias window.docxPreview → docx.js
        (docx-preview también se publica como window.docx: el alias evita que docx.js lo pise)
     4) xlsx-js-style (Excel) · Tailwind (layout)
     ======================================================================== -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.9/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.4.1/dist/docx-preview.min.js"></script>
<script>window.docxPreview = window.docx; window.docx = undefined;</script>
<script src="https://cdn.jsdelivr.net/npm/docx@9.8.1/dist/index.iife.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Tema guardado y configuración de Tailwind: síncrono y antes del primer pintado (ver js/tema.js) -->
<script src="js/tema.js"></script>

</head>
<body>
<div id="root"></div>
<noscript><p style="padding:2rem;font-family:system-ui">Bitácora Contratistas necesita JavaScript habilitado.</p></noscript>

<!-- ======================= Scripts de la aplicación (en orden) ======================= -->
<!-- 1) Configuración de Firebase y modo demostración (window.firebaseConfig, MODO_DEMO, db, auth, authReady) -->
<script src="js/firebase-config.js"></script>
<!-- 1b) Imágenes del formato Word en base64 (window.IMAGENES_B64) -->
<script src="js/imagenes-formato.js"></script>
<!-- 2) Utilidades compartidas (window.U) -->
<script src="js/util.js"></script>
<!-- 3) Fórmulas del motor de formularios (window.Formulas) -->
<script src="js/formulas.js"></script>
<!-- 4) Capa de datos: única que habla con Firestore o con la demostración (window.DB, window.Auth, window.SEMILLAS) -->
<script src="js/datos.js"></script>
<!-- 5) Flujos de Power Automate (window.Flujos) -->
<script src="js/flujos.js"></script>
<!-- 6) Informe mensual en Word con docx.js (window.InformeDocx) -->
<script src="js/informe-docx.js"></script>
<!-- 7) Descargas: Word, Excel y vista previa (window.Descargas) -->
<script src="js/descargas.js"></script>

<!-- 8–15) Interfaz React: JSX transpilado en el navegador por Babel. Todos los .jsx comparten el ámbito
     global (const de primer nivel), por eso el orden importa y ningún nombre puede repetirse entre archivos. -->
<script type="text/babel" data-presets="react" src="js/ui-base.jsx"></script>
<script type="text/babel" data-presets="react" src="js/auth.jsx"></script>
<script type="text/babel" data-presets="react" src="js/layout.jsx"></script>
<script type="text/babel" data-presets="react" src="js/motor.jsx"></script>
<script type="text/babel" data-presets="react" src="js/contratista.jsx"></script>
<script type="text/babel" data-presets="react" src="js/revision.jsx"></script>
<script type="text/babel" data-presets="react" src="js/admin.jsx"></script>
<script type="text/babel" data-presets="react" src="js/app.jsx"></script>
</body>
</html>
